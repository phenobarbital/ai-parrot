# Matrix Agents Swarm — Dev Stack (FEAT-463)
#
# Dev-only stack: no TLS, no Synapse workers (single-process homeserver).
# Synapse, Element Web, and the mautrix bridges below are AGPL-3.0-licensed
# and run as separate containers — they are never imported by the
# MIT-licensed ai-parrot Python code. See docs/integrations/matrix/BRIDGES.md.
#
# The parrot AppService itself runs on the HOST (not in this compose file),
# listening on `appservice_port: 8449` (MatrixCrewConfig default) — Synapse
# reaches it via `http://host.docker.internal:8449`.
#
# Quick start:
#   cp docker/matrix/.env.example docker/matrix/.env
#   ./scripts/matrix/bootstrap.sh
#
# Bridges (optional — Slack/Signal/Discord puppets):
#   docker compose -f docker-compose.matrix.yml --profile bridges up -d
#
# First-time Synapse config generation and full setup are handled by
# scripts/matrix/bootstrap.sh — see that script for the step-by-step flow.

services:
  postgres:
    image: postgres:16-alpine
    container_name: parrot-matrix-postgres
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapse}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/matrix/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 5s
      timeout: 5s
      retries: 10

  synapse:
    # Pinned stable release (>=1.114 required for native sliding sync, used
    # by Element X for discovery via the well-known sidecar below).
    image: ghcr.io/element-hq/synapse:${SYNAPSE_VERSION:-v1.157.2}
    container_name: parrot-matrix-synapse
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SYNAPSE_SERVER_NAME: parrot.local
      SYNAPSE_REPORT_STATS: "no"
    volumes:
      - ./docker/matrix/synapse:/data
    ports:
      - "8008:8008"
    extra_hosts:
      # Lets Synapse reach the parrot AppService running on the host.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8008/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  element-web:
    image: vectorim/element-web:${ELEMENT_VERSION:-v1.12.26}
    container_name: parrot-matrix-element
    ports:
      - "8080:80"
    volumes:
      - ./docker/matrix/element/config.json:/app/config.json:ro
    depends_on:
      - synapse

  well-known:
    # Serves /.well-known/matrix/{client,server} so Element X (and any
    # sliding-sync-aware client) can discover the homeserver.
    image: nginx:alpine
    container_name: parrot-matrix-well-known
    ports:
      - "8448:80"
    volumes:
      - ./docker/matrix/well-known/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/matrix/well-known/client.json:/usr/share/nginx/html/.well-known/matrix/client:ro
      - ./docker/matrix/well-known/server.json:/usr/share/nginx/html/.well-known/matrix/server:ro

  # --- bridges profile ---------------------------------------------------
  # Slack / Signal / Discord puppet bridges only. Other third-party network
  # bridges are documented but NOT included here (unofficial API / immature
  # upstream — see BRIDGES.md). E-mail bridging is rejected — agents send
  # e-mail via NotificationMixin instead.

  mautrix-signal:
    image: dock.mau.dev/mautrix/signal:v26.07
    container_name: parrot-matrix-bridge-signal
    profiles: [bridges]
    volumes:
      - ./docker/matrix/bridges/signal:/data
    depends_on:
      - synapse

  mautrix-slack:
    image: dock.mau.dev/mautrix/slack:v26.08
    container_name: parrot-matrix-bridge-slack
    profiles: [bridges]
    volumes:
      - ./docker/matrix/bridges/slack:/data
    depends_on:
      - synapse

  mautrix-discord:
    image: dock.mau.dev/mautrix/discord:v0.7.7
    container_name: parrot-matrix-bridge-discord
    profiles: [bridges]
    volumes:
      - ./docker/matrix/bridges/discord:/data
    depends_on:
      - synapse

volumes:
  pgdata: {}
