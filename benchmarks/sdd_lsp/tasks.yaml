  - id: inv-duplicate-names
    category: investigation
    title: Duplicate top-level function names across sibling modules
    prompt: >
      Two modules under pkg/ each define a function named `process`.
      Determine which `process` definition `pkg/caller.py`'s `run()`
      actually calls, and report the exact file and one-based line of
      that definition.
    fixture: inv-duplicate-names
    entry_point: null
    includes: [duplicate_names]
    required_evidence: [definition_location]
    supplementary_text_search: false
    fallback_required: false
    fixture_sha256: "477077ee549dce3c2d6f80ae8059add95e2eec6a766c01fca552dc01cc427fad"
    acceptance_commands:
      - [python, check.py]

