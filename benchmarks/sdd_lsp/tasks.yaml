# FEAT-580 M5 -- the twelve fixed pilot tasks (spec §2 Evaluation contract,
# §3 Module 5: "tasks are fixed before measurement").
#
# This file is the reviewable ground truth for the five-arm pilot: every
# task's fixture, required evidence and file-level acceptance command are
# pinned here BEFORE any live measurement runs, so a human can review the
# matrix (and its fixture hashes) independently of any arm's output.
#
# - `fixture` names a builder key in
#   `benchmarks/sdd_lsp/fixtures/scenarios.py` (`build_fixture`).
# - `fixture_sha256` pins the exact materialized baseline tree's content
#   hash (`ScenarioFixture.content_sha256()`); it must be identical across
#   every arm run for the same task (spec: "pin fixture content/hashes").
# - `acceptance_commands` are file-level checks run against the resulting
#   worktree after an attempt, identical regardless of which arm produced
#   the change (spec: "Preserve identical task checks across all arms").
#   Every task ships the same shape of command: run its bundled `check.py`
#   with the interpreter that is running the pilot.
# - `supplementary_text_search` marks tasks whose correct resolution
#   cannot rely on static go-to-definition alone (dynamic namespace
#   merging, a decorator-rewritten target, a string-keyed registry, or a
#   simulated unavailable semantic server), so seats must fall back to a
#   text search rather than trust a single navigation result.
# - `fallback_required` marks the one task that simulates the LSP server
#   itself being unavailable; the runner (TASK-3511) is responsible for
#   forcing that condition per arm, not this manifest.

schema_version: 1
task_count: 12
categories: [investigation, change, fix]

policy:
  # Cross-checked 1:1 against
  # `benchmarks.sdd_lsp.fixtures.acceptance.SUPPLEMENTARY_TEXT_SEARCH_SCENARIOS`
  # by test_dynamic_cases_require_additional_evidence.
  supplementary_text_search_required_for:
    - inv-namespace-import
    - chg-decorator-wrapper
    - chg-registry-dispatch
    - fix-unavailable-server

tasks:
