site_name: AI-Parrot
site_description: Async-first Python framework for building AI Agents and Chatbots
site_url: https://phenobarbital.github.io/ai-parrot/docs/
repo_url: https://github.com/phenobarbital/ai-parrot
repo_name: phenobarbital/ai-parrot
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site/docs

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  custom_dir: docs/overrides
  logo: branding/parrot.svg
  favicon: branding/favicon.ico
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - glightbox
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - packages/ai-parrot/src
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            docstring_style: google
            docstring_section_style: spacy
            members_order: source
            filters:
              - "!^_"
            heading_level: 2

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.mark

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/phenobarbital/ai-parrot
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/ai-parrot/

extra_css:
  - overrides/main.css

nav:
  - Home: index.md
  - Getting Started:
      - Installation: INSTALL.md
      - Configuration: config.md
      - Quick Start: getting-started.md
  - Concepts:
      - Foundations: chapters/foundations.md
      - LLM Clients: chapters/llm-clients.md
      - Bots & Agents: chapters/bots-agents.md
      - Memory & Knowledge: chapters/memory-knowledge.md
      - Knowledge Graph: chapters/knowledge-graph.md
      - Tools & RAG: chapters/tools-rag.md
      - Integrations: chapters/integrations.md
  - Tutorials:
      - Your First Chatbot: tutorials/first-chatbot.md
      - Your First Agent: tutorials/first-agent.md
      - Your First Tool: tutorials/first-tool.md
      - Deployment: tutorials/deployment.md
  - Guides:
      - CLI Agent Daemon: guides/cli-agent-daemon.md
  - About:
      - Style Guide: STYLE_GUIDE.md
      - SDD Workflow: sdd/WORKFLOW.md
