[build-system]
requires = ["setuptools>=77.0.0", "wheel>=0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-parrot-loaders"
dynamic = ["version"]
requires-python = ">=3.11,<3.14"
description = "Document loaders for AI-Parrot RAG pipelines"
readme = "README.md"
authors = [
    {name = "Jesus Lara", email = "jesuslara@phenobarbital.info"}
]
license = "MIT"
keywords = ["ai", "rag", "document-loaders", "pdf", "youtube", "agents", "asyncio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "ai-parrot>=1.2.0",
    "decorator>=5",
    "openpyxl>=3.1",
    "tabulate>=0.9",
    "semantic-text-splitter>=0.30,<1.0",
]

[project.optional-dependencies]
youtube = [
    "pytube==15.0.0",
    "youtube_transcript_api==1.0.3",
    "yt-dlp>=2026.02.21"
]
audio = [
    "whisperx==3.8.7rc1",
    "av==16.1.0",
    "resemblyzer==0.1.4",
    "torch-audiomentations==0.12.0",
    "torch-pitch-shift==1.2.5",
    "torchmetrics==1.8.2",
]
# Speaker diarization is temporarily unavailable as a declared extra.
# Lightning AI removed the `lightning` package from PyPI on 2026-04-30,
# and pyannote-audio 4.x declares `lightning>=2.4` as a transitive dep,
# which makes `uv lock` universally unsatisfiable. Even declaring a
# `diarization` extra (out of `all`) breaks the lock because uv resolves
# all workspace-member extras for the universal lock.
#
# Until upstream republishes `lightning` (or pyannote-audio pivots to
# pytorch-lightning), install diarization deps manually:
#
#     uv pip install pyannote-audio==4.0.4 pyannote-core==6.0.1 \
#         pyannote-database==6.1.1 pyannote-metrics==4.0.0 \
#         pyannote-pipeline==4.0.0
pdf = [
    "weasyprint==70.0",
    "fpdf==1.7.2",
    "markdownify>=1.2.2",
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.2",
    "python-docx==1.1.2",
    "paddleocr==3.2.0",
    "easyocr==1.7.2"
]
images = [
    "easyocr==1.7.2"
]
web = ["beautifulsoup4>=4.12", "html2text>=2024.0"]
ebook = [
    "ebooklib>=0.19",
    "beautifulsoup4>=4.12",
    "markdownify>=1.2.2",
    "mobi>=0.4.1,<0.5",
]
# Document ingestion used by wiki and other knowledge pipelines, without OCR.
documents = [
    "ai-parrot-loaders[ebook]",
    "python-docx==1.1.2",
    "pymupdf>=1.27",
    "pymupdf4llm>=0.0.27",
]
video = ["moviepy==2.2.1", "ffmpeg==1.4"]
document = ["mammoth>=1.11.0"]
scraping = [
    "trafilatura>=1.12",
    "beautifulsoup4>=4.12",
    "markdownify>=1.2.2",
]

# Core ML dependencies required by audio/whisperx
# NOTE: torch/torchaudio/torchvision are capped to match whisperx 3.8.7rc1 pins
# (torch~=2.8.0, torchaudio~=2.8.0, torchvision~=0.23.0). Bumping requires
# a newer whisperx release.
ml = [
    "torch>=2.8.0,<2.9",
    "torchaudio>=2.8.0,<2.9",
    "torchvision>=0.23.0,<0.24",
    # 2.6.5: fixes CWE-502 insecure checkpoint deserialization (load_from_checkpoint
    # called torch.load without weights_only=True). Affected: <=2.6.0.
    "pytorch-lightning==2.6.5",
    "pytorch-metric-learning==2.9.0",
    "nvidia-cudnn-cu12>=9.10.2.21",
]

# Heavy ML dependencies (slow install, GPU/ML workloads)
# NOTE: transformers>=5.3.0 fixes CVE-2026-4372 (GHSA-29pf-2h5f-8g72, RCE via a
# crafted config.json). transformers 5 needs huggingface-hub>=1.0, which is why
# whisperx is on 3.8.7rc1: 3.8.5/3.8.6 pin huggingface-hub<1.0. Move whisperx to
# 3.8.7 final once it ships.
ml-heavy = [
    "torch>=2.8.0,<2.9",
    "torchaudio>=2.8.0,<2.9",
    "numpy>=2.2.2,<3",
    "accelerate>=1.1.0",
    "bitsandbytes==0.49.2",
    "datasets>=3.0.2",
    "transformers>=5.3.0",
    "tensorflow>=2.20.0",
    "tf-keras>=2.20.0",
    "opencv-python==4.10.0.84",
]

all = ["ai-parrot-loaders[youtube,audio,pdf,images,web,ebook,documents,video,document,scraping,ml,ml-heavy]"]

[project.urls]
Homepage = "https://github.com/phenobarbital/ai-parrot"
Repository = "https://github.com/phenobarbital/ai-parrot"
Documentation = "https://github.com/phenobarbital/ai-parrot/"

[tool.setuptools.dynamic]
version = {attr = "parrot_loaders.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["parrot_loaders*"]

[tool.setuptools.package-data]
"parrot_loaders" = ["py.typed"]

[tool.uv.sources]
ai-parrot = { workspace = true }
