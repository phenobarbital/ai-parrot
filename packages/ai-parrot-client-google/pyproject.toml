[build-system]
requires = ["setuptools>=77.0.0", "wheel>=0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-parrot-client-google"
version = "0.2.5"
description = "Google GenAI (Gemini) LLM clients for AI-Parrot (parrot.clients.google)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [
    {name = "Jesus Lara", email = "jesuslara@phenobarbital.info"}
]
dependencies = [
    "ai-parrot>=1.0.5",
    # FEAT-564 TASK-3335: floor raised from 2.18.1 to 2.23.0 — the lowest
    # version this reel feature's async surfaces (aio.models.generate_videos,
    # aio.operations.get, aio.files.download, aio.interactions.create,
    # aio.live.music.connect, aio.aclose) were actually verified against, by
    # direct introspection of the installed SDK (2.23.0; see
    # docs/migration/video-reel-omni-veo-reliability.md "Tested SDK
    # versions"). 2.18.1 was never tested for these surfaces and is not
    # claimed to work; a higher, untested version (e.g. this workspace's
    # uv.lock currently resolves 2.24.0) is likewise not claimed — only what
    # was actually run against is declared as the floor.
    "google-genai>=2.23.0",
    # NOT declared here: google-api-python-client / google-cloud-texttospeech
    # / google-cloud-aiplatform — verified via grep that nothing under
    # parrot/clients/google/ imports any of them; those SDKs back other,
    # unrelated core Google integrations (Calendar/Sheets/TTS tools), not
    # this LLM client.
]

[project.entry-points."parrot.clients"]
google = "parrot.clients.google:GoogleGenAIClient"
gemini-live = "parrot.clients.google:GeminiLiveClient"
google-compat = "parrot.clients.google:GeminiOpenAICompatClient"

[tool.setuptools.packages.find]
where = ["src"]
include = ["parrot*"]
namespaces = true

[tool.uv.sources]
ai-parrot = { workspace = true }
