name: parrot-saas-tenant
runtime:
  name: python
  options:
    # The virtualenv is created by the deployer's own bootstrap, not by
    # Pulumi's `toolchain: pip` automation, so that a workspace checkout with
    # no venv here fails with a message naming the missing step rather than
    # with a Pulumi error about a missing interpreter.
    virtualenv: venv
description: >
  A dedicated stack for one AI-Parrot SaaS tenant: its own Docker network,
  Postgres (with a persistent volume), Redis, and a Community Manager worker.

config:
  parrot-saas-tenant:tenantId:
    type: string
    description: Tenant slug. Every resource name is derived from it.
  parrot-saas-tenant:image:
    type: string
    description: Container image for the tenant worker.
    default: ai-parrot:latest
  parrot-saas-tenant:hostPort:
    type: integer
    description: Host port published for the worker's HTTP surface.
    default: 18000
  parrot-saas-tenant:postgresImage:
    type: string
    default: postgres:16-alpine
  parrot-saas-tenant:redisImage:
    type: string
    default: redis:7-alpine
  parrot-saas-tenant:dbPassword:
    type: string
    secret: true
    description: >
      Password for the tenant's Postgres. Generated by the deployer and stored
      in the secret store; declared secret here so it is encrypted in the
      stack's own state file as well.
