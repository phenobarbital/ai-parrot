[build-system]
requires = [
    "setuptools>=77.0.0",
    "wheel>=0.44.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "ai-parrot-saas"
dynamic = ["version"]
description = "Multi-tenant SaaS control plane and agentic business flows for AI-Parrot"
authors = [
    {name = "Jesus Lara", email = "jesuslara@phenobarbital.info"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["asyncio", "saas", "multi-tenant", "agents", "ai", "parrot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Environment :: Web Environment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

# This package is the acyclic leaf of the workspace: it is the only place that
# may depend on ai-parrot (flows/agents), ai-parrot-server (BaseView,
# JobManager), ai-parrot-tools (PulumiExecutor) and navrules simultaneously.
# Nothing in the workspace may depend on ai-parrot-saas.
dependencies = [
    "pydantic>=2.0",
    "aiohttp>=3.9",
    "asyncdb>=2.11.6",
    "navconfig[default]>=2.2.2",
    "navrules>=0.1.5",
]

[project.optional-dependencies]
# The host packages are optional extras rather than hard dependencies so the
# domain layer (tenancy, coupons, rules) stays unit-testable without dragging
# in the whole aiohttp/navigator server stack.
parrot = [
    "ai-parrot>=0.25.34",
]
server = [
    "ai-parrot-server",
]
provisioning = [
    "ai-parrot-tools",
]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "cryptography>=41.0.7",
]

[project.urls]
Homepage = "https://github.com/phenobarbital/ai-parrot"
Source = "https://github.com/phenobarbital/ai-parrot"
Tracker = "https://github.com/phenobarbital/ai-parrot/issues"

[tool.setuptools.dynamic]
version = {attr = "parrot_saas.version.__version__"}

# ---------------------------------------------------------------------------
# Setuptools — src/ layout
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["src"]
include = ["parrot_saas*"]

[tool.setuptools.package-data]
"parrot_saas" = ["py.typed"]
# The Pulumi programs are data, not modules: they run under Pulumi's own
# interpreter and import a SDK this distribution does not depend on. They are
# keyed under ``parrot_saas.provisioning`` — with a glob covering the .py file
# too — because ``packages.find`` will not discover ``programs/docker`` as a
# package (it has no ``__init__.py``, deliberately), so a key naming it as one
# would silently match nothing and ship an empty directory.
"parrot_saas.provisioning" = ["programs/*/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
