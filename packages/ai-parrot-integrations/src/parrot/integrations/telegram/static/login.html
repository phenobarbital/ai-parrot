<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                   Roboto, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--tg-theme-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #222);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 2rem 1.5rem;
      background: var(--tg-theme-secondary-bg-color, #fff);
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 1.25rem; font-size: 1.35rem; font-weight: 600; }
    label { display: block; margin-top: 1rem; font-size: .9rem; font-weight: 500; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: .7rem .85rem;
      margin-top: .35rem;
      border-radius: 8px;
      border: 1px solid #d0d0d0;
      font-size: 1rem;
      background: var(--tg-theme-bg-color, #fff);
      color: inherit;
    }
    button {
      margin-top: 1.5rem;
      width: 100%;
      padding: .85rem;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .error { color: #c0392b; margin-top: 1rem; font-size: .9rem; }
    .hint { color: #888; font-size: .8rem; margin-top: 1rem; }
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      margin-right: 8px; vertical-align: -3px;
      border: 2px solid transparent;
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <meta name="parrot-browser-complete-origins" content="">
</head>
<body>
  <div class="card" role="main">
    <h1 id="title">Sign in to Navigator</h1>
    <form id="login-form" autocomplete="on" novalidate>
      <label>Username
        <input type="text" id="username" name="username" autocomplete="username"
               autocapitalize="none" required>
      </label>
      <label>Password
        <input type="password" id="password" name="password"
               autocomplete="current-password" required>
      </label>
      <button type="submit" id="submit-btn">Sign in</button>
      <div class="error" id="error" hidden></div>
      <p class="hint" id="hint"></p>
    </form>
  </div>

<script>
/*
 * Telegram WebApp login page with optional "redirect chain" for
 * secondary OAuth providers (Jira, etc.).
 *
 * URL parameters:
 *   auth_url              — Navigator auth endpoint (required).
 *   next_auth_url         — Optional. If set, after BasicAuth success the
 *                           browser redirects to this URL instead of
 *                           immediately calling Telegram.WebApp.sendData.
 *   next_auth_required    — Optional ("true"|"false", default "false").
 *                           If "true" and the redirect fails, the login
 *                           page reports an error instead of silently
 *                           falling back to BasicAuth-only sendData.
 *
 * The redirect target must be an absolute https:// URL; anything else is
 * ignored and the page falls back to sendData (or surfaces an error
 * when next_auth_required is truthy).
 */
(function () {
  const qs = new URLSearchParams(window.location.search);
  const authUrl = qs.get('auth_url');
  const nextAuthUrl = qs.get('next_auth_url');
  // "true" (default) vs. "false"
  const nextAuthRequired = (qs.get('next_auth_required') || 'false')
    .toLowerCase() === 'true';

  const tg = (window.Telegram && window.Telegram.WebApp) || null;
  if (tg) { tg.ready(); tg.expand(); }

  const form = document.getElementById('login-form');
  const submitBtn = document.getElementById('submit-btn');
  const errorEl = document.getElementById('error');
  const hintEl = document.getElementById('hint');

  if (nextAuthUrl) {
    hintEl.textContent =
      'After signing in you will be redirected to authorize a second service.';
  }

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.hidden = false;
  }

  function hideError() {
    errorEl.hidden = true;
  }

  function setLoading(loading) {
    submitBtn.disabled = loading;
    submitBtn.innerHTML = loading
      ? '<span class="spinner" aria-hidden="true"></span>Signing in…'
      : 'Sign in';
  }

  /**
   * Validate that the redirect target is a safe, absolute https URL.
   * Prevents javascript:, data:, and relative-path injection.
   */
  function isSafeRedirect(url) {
    try {
      const u = new URL(url);
      return u.protocol === 'https:';
    } catch (_) {
      return false;
    }
  }

  // FEAT-854 browser-mode completion — keep this block identical in all login pages.
  var BROWSER_COMPLETE_PATH = '/api/auth/telegram/browser-complete';
  var BROWSER_STATE_RE = /^browser\.[A-Za-z0-9_-]{43}$/;
  var BROWSER_CTX_KEY = 'tg_browser_login_ctx';

  function readBrowserContext() {
    var q = new URLSearchParams(window.location.search);
    var marker = null;
    try { marker = JSON.parse(window.sessionStorage.getItem(BROWSER_CTX_KEY) || 'null'); } catch (e) { marker = null; }
    var ctx = { mode: q.get('return_mode'), state: q.get('state'), completeUrl: q.get('complete_url'), marker: marker };
    ctx.present = !!(ctx.mode || ctx.completeUrl || marker ||
                     (ctx.state && ctx.state.indexOf('browser.') === 0));
    return ctx;
  }

  function allowedCompletionOrigins() {
    var meta = document.querySelector('meta[name="parrot-browser-complete-origins"]');
    var extra = meta ? (meta.getAttribute('content') || '').split(/\s+/).filter(Boolean) : [];
    return [window.location.origin].concat(extra);
  }

  function validateBrowserContext(ctx) {
    // Check return_mode
    if (ctx.present && ctx.mode !== 'browser') {
      return 'Invalid return mode.';
    }
    // Check state format
    if (ctx.present && ctx.state && !BROWSER_STATE_RE.test(ctx.state)) {
      return 'Invalid state format.';
    }
    // Check marker matches state if both present
    if (ctx.present && ctx.marker && ctx.state && ctx.marker.state !== ctx.state) {
      return 'State mismatch.';
    }
    // Check complete_url
    if (ctx.present && ctx.completeUrl) {
      try {
        var u = new URL(ctx.completeUrl);
        // No query or hash allowed
        if (u.search || u.hash) {
          return 'Complete URL must not contain query or hash.';
        }
        // Must be the expected path
        if (u.pathname !== BROWSER_COMPLETE_PATH) {
          return 'Invalid completion endpoint.';
        }
        // Protocol check
        if (u.protocol !== 'https:' && u.protocol !== 'http:') {
          return 'Invalid protocol.';
        }
        // Same-origin allowed, otherwise check allowed list
        if (u.origin !== window.location.origin) {
          var allowed = allowedCompletionOrigins();
          if (allowed.indexOf(u.origin) === -1) {
            return 'Origin not allowed.';
          }
        }
      } catch (e) {
        return 'Invalid complete URL.';
      }
    }
    return null;
  }

  function appendBrowserParams(params) {
    var ctx = readBrowserContext();
    if (!ctx.present) { return true; }
    var err = validateBrowserContext(ctx);
    if (err) { showBrowserResult(false, err); return false; }
    params.set('return_mode', 'browser');
    params.set('state', ctx.state);
    params.set('complete_url', ctx.completeUrl);
    try { window.sessionStorage.setItem(BROWSER_CTX_KEY, JSON.stringify({ state: ctx.state })); } catch (e) { /* storage blocked */ }
    return true;
  }

  function completeLogin(payload, legacySend) {
    var ctx = readBrowserContext();
    if (!ctx.present) { legacySend(); return; }
    var err = validateBrowserContext(ctx);
    if (err) { showBrowserResult(false, err); return; }
    // POST to complete_url
    var postData = Object.assign({}, payload, { state: ctx.state });
    fetch(ctx.completeUrl, {
      method: 'POST',
      credentials: 'omit',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(postData)
    }).then(function(resp) {
      if (resp.ok) {
        return resp.json().then(function(data) {
          if (data.ok) {
            showBrowserResult(true, 'Authentication complete.', data.redirect_url);
          } else {
            showBrowserResult(false, data.message || 'Authentication failed.');
          }
        }).catch(function() {
          showBrowserResult(false, 'Invalid server response.');
        });
      } else if (resp.status === 410) {
        showBrowserResult(false, 'Link expired. Send /login again.');
      } else if (resp.status === 401) {
        showBrowserResult(false, 'Sign-in rejected.');
      } else if (resp.status === 503) {
        showBrowserResult(false, 'Server temporarily unavailable.');
      } else {
        showBrowserResult(false, 'Authentication failed (HTTP ' + resp.status + ').');
      }
    }).catch(function(err) {
      showBrowserResult(false, 'Network error.');
    });
    // Clear the marker
    try { window.sessionStorage.removeItem(BROWSER_CTX_KEY); } catch (e) { /* ignore */ }
  }

  function showBrowserResult(ok, message, redirectUrl) {
    var card = document.querySelector('.card');
    if (!card) { return; }
    card.innerHTML = '';
    var h1 = document.createElement('h1');
    h1.textContent = ok ? 'Success' : 'Error';
    card.appendChild(h1);
    var p = document.createElement('p');
    p.textContent = message;
    p.style.marginTop = '1rem';
    card.appendChild(p);
    if (ok && redirectUrl && redirectUrl.indexOf('https://t.me/') === 0) {
      var a = document.createElement('a');
      a.href = redirectUrl;
      a.textContent = 'Return to Telegram';
      a.style.display = 'inline-block';
      a.style.marginTop = '1.5rem';
      a.style.padding = '0.85rem 1.5rem';
      a.style.background = 'var(--tg-theme-button-color, #2481cc)';
      a.style.color = 'var(--tg-theme-button-text-color, #fff)';
      a.style.borderRadius = '8px';
      a.style.textDecoration = 'none';
      a.style.fontWeight = '600';
      card.appendChild(a);
    }
  }

  /**
   * Send the BasicAuth payload back to Telegram and close the WebApp.
   * Used when there is no `next_auth_url` or when the redirect fails
   * and `next_auth_required` is false.
   */
  function sendBasicAuthAndClose(payload) {
    completeLogin(payload, function legacySend() {
      if (tg && typeof tg.sendData === 'function') {
        tg.sendData(JSON.stringify(payload));
        setTimeout(function () { tg.close(); }, 300);
      } else {
        showError(
          'Telegram WebApp is not available. ' +
          'Open this link from inside the Telegram app.'
        );
      }
    });
  }

  /**
   * Handle BasicAuth success. If `next_auth_url` is set and safe,
   * redirect the browser (staying inside the WebApp). Otherwise send
   * the BasicAuth payload back to Telegram immediately.
   */
  function onAuthSuccess(payload) {
    if (nextAuthUrl && isSafeRedirect(nextAuthUrl)) {
      // The primary-auth payload is already persisted server-side via
      // the CSRF nonce's extra_state (see JiraPostAuthProvider), so we
      // do NOT need to pass it through the redirect URL.
      window.location.href = nextAuthUrl;
      return;
    }
    if (nextAuthUrl && !isSafeRedirect(nextAuthUrl)) {
      if (nextAuthRequired) {
        showError('Secondary authentication URL is invalid or insecure.');
        setLoading(false);
        return;
      }
      // Insecure URL; fall back to BasicAuth-only behavior.
    }
    sendBasicAuthAndClose(payload);
  }

  form.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    hideError();
    setLoading(true);

    if (!authUrl) {
      showError('Missing auth_url parameter.');
      setLoading(false);
      return;
    }

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (!username || !password) {
      showError('Username and password are required.');
      setLoading(false);
      return;
    }

    try {
      const resp = await fetch(authUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password }),
        credentials: 'include'
      });
      if (!resp.ok) {
        throw new Error('Invalid credentials (HTTP ' + resp.status + ').');
      }
      const body = await resp.json();
      const payload = {
        auth_method: "basic",
        user_id: body.user_id || body.id || body.sub,
        token: body.token || body.session_token || body.access_token,
        display_name: body.display_name || body.name || username,
        email: body.email || null
      };
      if (!payload.user_id) {
        throw new Error('Auth response missing user_id.');
      }
      onAuthSuccess(payload);
    } catch (err) {
      setLoading(false);
      showError('Sign-in failed: ' + (err && err.message ? err.message : err));
    }
  });
})();
</script>
</body>
</html>
