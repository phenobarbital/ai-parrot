<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Azure SSO Login</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: var(--tg-theme-bg-color, #1a1a2e);
            color: var(--tg-theme-text-color, #e0e0e0);
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background: var(--tg-theme-secondary-bg-color, #16213e);
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-header .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .login-header h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--tg-theme-text-color, #e0e0e0);
        }

        .login-header p {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #a0a0a0);
            margin-top: 6px;
        }

        .btn-azure {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: var(--tg-theme-button-color, #0078d4);
            color: var(--tg-theme-button-text-color, #fff);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-azure:hover {
            opacity: 0.85;
        }

        .btn-azure:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-azure .ms-icon {
            font-size: 18px;
            line-height: 1;
        }

        .status-msg {
            text-align: center;
            font-size: 13px;
            margin-top: 14px;
            min-height: 20px;
        }

        .status-msg.error {
            color: #ff6b6b;
        }

        .status-msg.success {
            color: #51cf66;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <meta name="parrot-browser-complete-origins" content="">
</head>

<body>
    <div class="login-card">
        <div class="login-header">
            <div class="icon">&#x1F510;</div>
            <h1>Azure SSO</h1>
            <p>Sign in with your organization account</p>
        </div>

        <div id="mainContent">
            <!-- Content injected by JS based on query params -->
        </div>

        <div class="status-msg" id="statusMsg"></div>
    </div>

    <script>
        // FEAT-854 browser-mode completion — keep this block identical in all login pages.
        var BROWSER_COMPLETE_PATH = '/api/auth/telegram/browser-complete';
        var BROWSER_STATE_RE = /^browser\.[A-Za-z0-9_-]{43}$/;
        var BROWSER_CTX_KEY = 'tg_browser_login_ctx';

        function readBrowserContext() {
            var q = new URLSearchParams(window.location.search);
            var marker = null;
            try { marker = JSON.parse(window.sessionStorage.getItem(BROWSER_CTX_KEY) || 'null'); } catch (e) { marker = null; }
            var ctx = { mode: q.get('return_mode'), state: q.get('state'), completeUrl: q.get('complete_url'), marker: marker };
            ctx.present = !!(ctx.mode || ctx.completeUrl || marker ||
                             (ctx.state && ctx.state.indexOf('browser.') === 0));
            return ctx;
        }

        function allowedCompletionOrigins() {
            var meta = document.querySelector('meta[name="parrot-browser-complete-origins"]');
            var extra = meta ? (meta.getAttribute('content') || '').split(/\s+/).filter(Boolean) : [];
            return [window.location.origin].concat(extra);
        }

        function validateBrowserContext(ctx) {
            // Check return_mode
            if (ctx.present && ctx.mode !== 'browser') {
                return 'Invalid return mode.';
            }
            // Check state format
            if (ctx.present && ctx.state && !BROWSER_STATE_RE.test(ctx.state)) {
                return 'Invalid state format.';
            }
            // Check marker matches state if both present
            if (ctx.present && ctx.marker && ctx.state && ctx.marker.state !== ctx.state) {
                return 'State mismatch.';
            }
            // Check complete_url
            if (ctx.present && ctx.completeUrl) {
                try {
                    var u = new URL(ctx.completeUrl);
                    // No query or hash allowed
                    if (u.search || u.hash) {
                        return 'Complete URL must not contain query or hash.';
                    }
                    // Must be the expected path
                    if (u.pathname !== BROWSER_COMPLETE_PATH) {
                        return 'Invalid completion endpoint.';
                    }
                    // Protocol check
                    if (u.protocol !== 'https:' && u.protocol !== 'http:') {
                        return 'Invalid protocol.';
                    }
                    // Same-origin allowed, otherwise check allowed list
                    if (u.origin !== window.location.origin) {
                        var allowed = allowedCompletionOrigins();
                        if (allowed.indexOf(u.origin) === -1) {
                            return 'Origin not allowed.';
                        }
                    }
                } catch (e) {
                    return 'Invalid complete URL.';
                }
            }
            return null;
        }

        function appendBrowserParams(params) {
            var ctx = readBrowserContext();
            if (!ctx.present) { return true; }
            var err = validateBrowserContext(ctx);
            if (err) { showBrowserResult(false, err); return false; }
            params.set('return_mode', 'browser');
            params.set('state', ctx.state);
            params.set('complete_url', ctx.completeUrl);
            try { window.sessionStorage.setItem(BROWSER_CTX_KEY, JSON.stringify({ state: ctx.state })); } catch (e) { /* storage blocked */ }
            return true;
        }

        function completeLogin(payload, legacySend) {
            var ctx = readBrowserContext();
            if (!ctx.present) { legacySend(); return; }
            var err = validateBrowserContext(ctx);
            if (err) { showBrowserResult(false, err); return; }
            // POST to complete_url
            var postData = Object.assign({}, payload, { state: ctx.state });
            fetch(ctx.completeUrl, {
                method: 'POST',
                credentials: 'omit',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(postData)
            }).then(function(resp) {
                if (resp.ok) {
                    return resp.json().then(function(data) {
                        if (data.ok) {
                            showBrowserResult(true, 'Authentication complete.', data.redirect_url);
                        } else {
                            showBrowserResult(false, data.message || 'Authentication failed.');
                        }
                    }).catch(function() {
                        showBrowserResult(false, 'Invalid server response.');
                    });
                } else if (resp.status === 410) {
                    showBrowserResult(false, 'Link expired. Send /login again.');
                } else if (resp.status === 401) {
                    showBrowserResult(false, 'Sign-in rejected.');
                } else if (resp.status === 503) {
                    showBrowserResult(false, 'Server temporarily unavailable.');
                } else {
                    showBrowserResult(false, 'Authentication failed (HTTP ' + resp.status + ').');
                }
            }).catch(function(err) {
                showBrowserResult(false, 'Network error.');
            });
            // Clear the marker
            try { window.sessionStorage.removeItem(BROWSER_CTX_KEY); } catch (e) { /* ignore */ }
        }

        function showBrowserResult(ok, message, redirectUrl) {
            var card = document.querySelector('.login-card');
            if (!card) { return; }
            card.innerHTML = '';
            var h1 = document.createElement('h1');
            h1.textContent = ok ? 'Success' : 'Error';
            h1.style.textAlign = 'center';
            h1.style.marginBottom = '1rem';
            card.appendChild(h1);
            var p = document.createElement('p');
            p.textContent = message;
            p.style.textAlign = 'center';
            p.style.marginTop = '1rem';
            card.appendChild(p);
            if (ok && redirectUrl && redirectUrl.indexOf('https://t.me/') === 0) {
                var a = document.createElement('a');
                a.href = redirectUrl;
                a.textContent = 'Return to Telegram';
                a.style.display = 'inline-block';
                a.style.marginTop = '1.5rem';
                a.style.padding = '14px 24px';
                a.style.background = 'var(--tg-theme-button-color, #0078d4)';
                a.style.color = 'var(--tg-theme-button-text-color, #fff)';
                a.style.borderRadius = '10px';
                a.style.textDecoration = 'none';
                a.style.fontWeight = '600';
                a.style.textAlign = 'center';
                card.appendChild(a);
            }
        }

        var tg = (window.Telegram && window.Telegram.WebApp) || null;
        if (tg) { tg.ready(); tg.expand(); }

        // Parse query parameters from current URL
        const params = new URLSearchParams(window.location.search);
        const azureAuthUrl = params.get('azure_auth_url') || '';
        const token = params.get('token') || '';

        // FEAT-109: post-auth chain params — preserved across the Microsoft
        // round-trip so the chain can continue after the JWT is captured.
        const nextAuthUrl = params.get('next_auth_url') || '';
        const nextAuthRequired = params.get('next_auth_required') === 'true';

        const mainContent = document.getElementById('mainContent');
        const statusMsg = document.getElementById('statusMsg');

        function showStatus(msg, type) {
            statusMsg.className = 'status-msg ' + (type || '');
            statusMsg.innerHTML = msg;
        }

        /**
         * Check that a redirect URL is safe (same origin or HTTPS).
         * Prevents open-redirect abuse.
         */
        function isSafeRedirect(url) {
            try {
                var u = new URL(url);
                return u.protocol === 'https:';
            } catch (e) {
                return false;
            }
        }

        /**
         * Token redirect-back flow.
         * Called when Navigator has redirected back with ?token= in the URL.
         *
         * If next_auth_url is set and safe, redirect the browser to it so the
         * secondary auth (e.g. Jira OAuth2) can proceed. Otherwise send the
         * Azure JWT directly back to the Telegram bot via WebApp.sendData().
         */
        function handleTokenCallback(tokenValue) {
            mainContent.innerHTML = '<div style="text-align:center;padding:20px;">' +
                '<span class="spinner"></span>' +
                '<span style="font-size:14px;">Completing authentication&hellip;</span>' +
                '</div>';

            // FEAT-109: if a secondary auth URL is configured and safe,
            // redirect to it now. The JWT has been captured server-side via
            // the CSRF nonce's extra_state; we do NOT need to embed it in the
            // redirect URL.
            if (nextAuthUrl && isSafeRedirect(nextAuthUrl)) {
                showStatus(
                    '<span class="spinner"></span> Redirecting to secondary authentication&hellip;',
                    ''
                );
                setTimeout(function () {
                    window.location.href = nextAuthUrl;
                }, 300);
                return;
            }

            // No secondary auth — use completeLogin for browser mode, legacy sendData otherwise.
            var payloadObj = { auth_method: 'azure', token: tokenValue };
            var payload = JSON.stringify(payloadObj);

            completeLogin(payloadObj, function legacySend() {
                showStatus(
                    '<span class="spinner"></span> Authentication complete. Returning to bot&hellip;',
                    'success'
                );
                // Send data back to Telegram bot, then close the WebApp.
                // Guard against non-WebApp contexts (e.g. browser dev/testing).
                setTimeout(function () {
                    if (tg && typeof tg.sendData === 'function') {
                        tg.sendData(payload);
                        setTimeout(function () { tg.close(); }, 500);
                    } else {
                        showStatus('&#x2705; Token captured. Return to Telegram.', 'success');
                    }
                }, 300);
            });
        }

        /**
         * Login button flow.
         * Called when page loads without a token — shows the Azure sign-in button.
         */
        function showLoginButton(azureUrl) {
            var btn = document.createElement('button');
            btn.className = 'btn-azure';
            btn.type = 'button';
            btn.innerHTML = '<span class="ms-icon">&#x1F4BC;</span> Sign in with Azure';
            btn.addEventListener('click', function () {
                btn.disabled = true;
                showStatus('<span class="spinner"></span> Redirecting to Azure&hellip;', '');

                // Build redirect_uri — must preserve azure_auth_url AND the
                // FEAT-109 next_auth_url / next_auth_required params so the
                // page knows its full configuration on redirect-back.
                // NOTE: navigator-auth reads this under `redirect_uri` (not
                // `redirect_url`); mismatching the name makes Navigator drop
                // it and fall back to AUTH_REDIRECT_URI (e.g. the frontend
                // /auth/sso middleware on localhost), which is unreachable
                // from the Telegram in-app browser.
                var pageBase = window.location.href.split('?')[0];
                var preserveParams = new URLSearchParams();
                preserveParams.set('azure_auth_url', azureUrl);
                if (nextAuthUrl) {
                    preserveParams.set('next_auth_url', nextAuthUrl);
                    if (nextAuthRequired) {
                        preserveParams.set('next_auth_required', 'true');
                    }
                }
                if (!appendBrowserParams(preserveParams)) { return; }
                var redirectUrl = pageBase + '?' + preserveParams.toString();

                // Build the full Navigator Azure endpoint URL
                var sep = azureUrl.indexOf('?') !== -1 ? '&' : '?';
                var fullUrl = azureUrl + sep + 'redirect_uri=' + encodeURIComponent(redirectUrl);

                window.location.href = fullUrl;
            });

            mainContent.appendChild(btn);
        }

        /**
         * Error state — shown when no azure_auth_url is configured.
         */
        function showError(msg) {
            mainContent.innerHTML = '';
            showStatus('&#x274C; ' + msg, 'error');
        }

        // --- Main flow ---
        if (token) {
            // Redirect-back flow: Navigator sent us back with a JWT
            handleTokenCallback(token);
        } else if (azureAuthUrl) {
            // Login button flow: show the Azure SSO button
            showLoginButton(azureAuthUrl);
        } else {
            // Misconfiguration: no azure_auth_url provided
            showError('Azure authentication is not configured. Please contact your administrator.');
        }
    </script>
</body>

</html>
