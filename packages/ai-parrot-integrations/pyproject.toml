[build-system]
requires = ["setuptools>=77.0.0", "wheel>=0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-parrot-integrations"
dynamic = ["version"]
description = "Messaging channel integrations for AI-Parrot (Slack, Telegram, MS Teams, WhatsApp, Matrix, Voice)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Jesus Lara", email = "jesuslara@phenobarbital.info"}
]
keywords = ["ai", "chatbot", "messaging", "telegram", "slack", "msteams", "whatsapp", "matrix"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Communications :: Chat",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "ai-parrot",
]

[project.optional-dependencies]
# FEAT-422 — Agent CLI Daemon. Marker extra: rich/prompt_toolkit/click/
# pydantic/pyyaml all come from ai-parrot core already, so this extra is
# deliberately empty — it exists only so the core CLI's missing-DISTRIBUTION
# error can name a concrete `pip install` target. It can never fix an
# ImportError raised from *inside* an installed agentd (see
# `LazyGroup._is_missing_target` in parrot/cli/__init__.py).
agentd = []
# Optional `schedules.*` RPC support for the daemon. Without it
# `AgentDaemon._start_scheduler()` degrades to SCHEDULER_UNAVAILABLE (1003).
agentd-scheduler = [
    "ai-parrot-server[scheduler]",
]
slack = [
    "slack-sdk>=3.27",
    "slack-bolt>=1.18",
]
telegram = [
    "aiogram>=3.12",
]
msteams = [
    "azure-teambots>=0.1.1",
    "parrot-formdesigner",
    "redis>=5.0",
]
whatsapp = [
    "pywa>=3.8.0",
]
matrix = [
    "mautrix>=0.20",
    "python-olm>=3.2.16",
]
voice-local = [
    "faster-whisper",
]
voice-openai = [
    "openai>=3.3.1",
]
voice-tts = [
    "pydub>=0.25",
]
voice-supertonic = [
    "onnxruntime>=1.17",
]
voice-moonshine = [
    "useful-moonshine-onnx",
]
# msagentsdk is intentionally NOT included in the `all` bundle.
# The microsoft-agents-hosting-aiohttp SDK is an optional dependency that
# users must explicitly opt into. Install with:
#   pip install ai-parrot-integrations[msagentsdk]
msagentsdk = [
    "microsoft-agents-hosting-aiohttp~=0.9.0",
    # MSAL-based connection manager: required for Azure AD auth mode. The
    # CloudAdapter needs a concrete `Connections` provider to obtain outbound
    # channel tokens and to validate inbound JWTs (see MSAgentSDKWrapper).
    "microsoft-agents-authentication-msal~=0.9.0",
]
# LiveAvatar (FEAT-242) is intentionally NOT part of the `all` bundle: it pulls
# the livekit-api transport and incurs LiveAvatar/LiveKit minutes, so it is
# opt-in only. Install explicitly: ai-parrot-integrations[liveavatar].
liveavatar = [
    "livekit-api>=1.0",
    "livekit~=1.1",
]
voice = [
    "ai-parrot-integrations[voice-local]",
    "ai-parrot-integrations[voice-openai]",
    "ai-parrot-integrations[voice-tts]",
    "ai-parrot-integrations[voice-supertonic]",
    "ai-parrot-integrations[voice-moonshine]",
]
messaging = [
    "ai-parrot-integrations[slack]",
    "ai-parrot-integrations[telegram]",
    "ai-parrot-integrations[msteams]",
    "ai-parrot-integrations[whatsapp]",
]
# FEAT-453 code-review remediation: WhatsAppBridgeWrapper's fail-closed
# financial control (bridge_wrapper.py::_agent_exposes_submit_operation)
# detects a bound BusinessAutomationToolkit by importing
# parrot_tools.business_automation, deferred and guarded by
# try/except ImportError so ai-parrot-tools stays optional for every
# other WhatsApp deployment. Intentionally NOT part of `all` (like
# `liveavatar`/`msagentsdk`) — ai-parrot-tools is a large distribution
# with dozens of unrelated extras; only opt in when actually running a
# BusinessAutomationToolkit-backed agent over WhatsApp.
business-automation = [
    "ai-parrot-tools",
]
all = [
    "ai-parrot-integrations[messaging]",
    "ai-parrot-integrations[matrix]",
    "ai-parrot-integrations[voice]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/phenobarbital/ai-parrot"
Source = "https://github.com/phenobarbital/ai-parrot"

[tool.setuptools.dynamic]
version = {attr = "parrot.integrations.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["parrot*"]
namespaces = true

# Non-Python data files (HTML login pages, voice UI assets). Without this
# section setuptools ships only the .py modules, so the runtime fails to
# locate parrot/integrations/telegram/static/*.html and parrot/voice/ui/*.
[tool.setuptools.package-data]
"parrot.integrations.telegram" = ["static/*.html"]
"parrot.voice" = ["ui/*.html", "ui/*.js"]

# Resolve botbuilder-dialogs↔aiogram emoji version clash (FEAT-205 / D3).
# botbuilder-dialogs pins emoji==1.7.0; aiogram>=3.12 does not declare
# a conflicting emoji requirement (tested with aiogram 3.28.2), so pinning
# to 1.7.0 satisfies both. Revisit if aiogram adds an emoji dependency.
[tool.uv]
override-dependencies = ["emoji==1.7.0"]

[tool.uv.sources]
ai-parrot = { workspace = true }
parrot-formdesigner = { workspace = true }
# FEAT-453: business-automation extra (bridge_wrapper.py's fail-closed check).
ai-parrot-tools = { workspace = true }
