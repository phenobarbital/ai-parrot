[build-system]
requires = ["setuptools>=77.0.0", "wheel>=0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-parrot-client-local"
version = "0.2.0"
description = "Local (Ollama/llama.cpp, OpenAI-compatible) LLM client for AI-Parrot (parrot.clients.local)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Jesus Lara", email = "jesuslara@phenobarbital.info"}
]
dependencies = [
    "ai-parrot>=0.29.0",
    # No extra SDK: LocalLLMClient extends OpenAIBaseClient (core) and
    # talks to any OpenAI-compatible local server (Ollama, llama.cpp, ...)
    # over the base_url it's given — nothing else to declare.
]

[project.entry-points."parrot.clients"]
local = "parrot.clients.local:LocalLLMClient"
localllm = "parrot.clients.local:LocalLLMClient"
ollama = "parrot.clients.local:LocalLLMClient"
llamacpp = "parrot.clients.local:LocalLLMClient"

[tool.setuptools.packages.find]
where = ["src"]
include = ["parrot*"]
namespaces = true

[tool.uv.sources]
ai-parrot = { workspace = true }
