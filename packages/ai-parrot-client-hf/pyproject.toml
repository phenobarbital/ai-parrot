[build-system]
requires = ["setuptools>=77.0.0", "wheel>=0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-parrot-client-hf"
version = "0.2.0"
description = "HuggingFace transformers micro-LLM client for AI-Parrot (parrot.clients.hf)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Jesus Lara", email = "jesuslara@phenobarbital.info"}
]
dependencies = [
    "ai-parrot>=0.29.0",
    "transformers>=4.48.0,<5.0",
    # NOT declared here: `torch` (imported lazily inside methods, same
    # undeclared/install-separately pattern as gemma4) or
    # `sentence-transformers` (not imported anywhere in parrot/clients/hf/
    # — that package backs the UNRELATED ai-parrot-embeddings[huggingface]
    # extra, not this LLM client).
]

[project.entry-points."parrot.clients"]
hf = "parrot.clients.hf:TransformersClient"
transformers = "parrot.clients.hf:TransformersClient"

[tool.setuptools.packages.find]
where = ["src"]
include = ["parrot*"]
namespaces = true

[tool.uv.sources]
ai-parrot = { workspace = true }
