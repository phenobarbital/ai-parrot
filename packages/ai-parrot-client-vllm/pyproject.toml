[build-system]
requires = ["setuptools>=77.0.0", "wheel>=0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-parrot-client-vllm"
version = "0.2.0"
description = "vLLM (OpenAI-compatible) LLM client for AI-Parrot (parrot.clients.vllm)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Jesus Lara", email = "jesuslara@phenobarbital.info"}
]
dependencies = [
    "ai-parrot>=0.29.0",
    # vLLMClient subclasses LocalLLMClient (parrot.clients.local) directly
    # -- this is a real, unconditional import (`from ..local import
    # LocalLLMClient`), not a lazy/optional one, so the satellite
    # dependency is required, not just recommended.
    "ai-parrot-client-local",
]

[project.entry-points."parrot.clients"]
vllm = "parrot.clients.vllm:vLLMClient"

[tool.setuptools.packages.find]
where = ["src"]
include = ["parrot*"]
namespaces = true

[tool.uv.sources]
ai-parrot = { workspace = true }
ai-parrot-client-local = { workspace = true }
