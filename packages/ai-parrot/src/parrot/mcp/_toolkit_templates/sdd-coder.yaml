# parrot:summary: FEAT-549 sdd-coder orchestration kernel (heterogeneous model seats).
# parrot:requires_llm: false
  sdd-coder:
    class: parrot.flows.dev_loop.sdd_coder.toolkit.SddCoderToolkit
    # The roster is pure config. Seats whose credentials or CLI are missing are
    # dropped by the probe on the first `coder_plan` call and reported there:
    #   nova          -> BEDROCK_MANTLE_API_KEY / AWS_NOVA_API_KEY
    #   google-compat -> GEMINI_API_KEY / GOOGLE_API_KEY
    #   codex         -> the `codex` CLI's own login
    #   haiku         -> native Claude Code sub-agent, no credentials
    kwargs:
      # Optional per-seat reasoning effort (commented; shipped behaviour is unchanged).
      #   Add `effort: <v>` to a roster seat or to a complexity.strong_models entry, e.g.
      #     - {label: gpt-5.6-sol, kind: mcp, backend: codex, model: gpt-5.6-sol, effort: medium}
      #   Vocabulary: none | minimal | low | medium | high | xhigh | max. A typo fails at start-up.
      #   Precedence per attempt: the matching strong_models[].effort (only for complex/unknown
      #   tasks), then the seat's `effort`, then the backend default (env / ~/.codex/config.toml).
      #   Supported: codex (minimal..xhigh), zai, moonshot, google-compat (none|low|medium|high),
      #   google_coding (low|medium|high), native seats (low|medium|high|xhigh|max, passed by
      #   sdd-worker to the Agent tool; strong_models match them as backend `native`). nova, grok
      #   and claude-code ignore it with a WARNING; a value the backend does not accept is skipped
      #   with a WARNING.
      #   Adding `effort` to strong_models changes policy_sha256 once (cached evidence is recomputed).
      roster:
        - {label: qwen,        kind: mcp,    backend: nova,          model: qwen.qwen3-coder-480b-a35b-instruct}
        - {label: gemini,      kind: mcp,    backend: google-compat, model: gemini-3.5-flash}
        - {label: codex-spark, kind: mcp,    backend: codex,         model: gpt-5.3-codex-spark}
        - {label: haiku,       kind: native, model: haiku}
        # FEAT-561 strong seats for complex/unknown-classified tasks. A seat is
        # eligible only because its exact (backend, model) is listed under
        # complexity.strong_models below. `sonnet` / `opus` are the model IDs the
        # Claude Code Agent tool accepts for native seats; canonical policy names
        # are `sonnet-5` and `opus-4` respectively.
        - {label: gpt-5.6-terra, kind: mcp,  backend: codex,         model: gpt-5.6-terra}
        # Multiple strong MCP seats are required, not optional: the retry ladder
        # (`SddCoderEngine._select_retry_seat`, `ChunkAssigner.retry_seat`) skips
        # `kind: native`, so with only one strong MCP seat a complex/unknown task
        # that fails attempt 1 has an empty retry set (issue:569e81756247).
        - {label: gpt-5.6-sol,  kind: mcp,   backend: codex,         model: gpt-5.6-sol}
        - {label: opus,         kind: native, model: opus}
        - {label: sonnet,       kind: native, model: sonnet}
      # FEAT-561 — strong-model allowlist (sdd/specs/complex-sdd-tasks.spec.md §2).
      # Sibling of `roster`, forwarded to ComplexityPolicy.strong_models. Complex and
      # unknown tasks may only run on a roster seat whose exact (backend, model) is
      # listed here; an EMPTY list blocks every such task with
      # complex_model_unavailable. `canonical_model` is the policy name, `model` is
      # the exact ID the backend is invoked with — this operator-maintained mapping
      # is the only place a canonical name may be tied to a deployed ID.
      complexity:
        strong_models:
          - {canonical_model: gpt-5.6-terra, backend: codex, model: gpt-5.6-terra}
          - {canonical_model: gpt-5.6-sol, backend: codex, model: gpt-5.6-sol}
          - {canonical_model: opus-4, backend: native, model: opus}
          - {canonical_model: sonnet-5, backend: native, model: sonnet}
