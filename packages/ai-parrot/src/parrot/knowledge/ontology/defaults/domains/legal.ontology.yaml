name: legal
version: "1.1"
description: >
  Legal Norms Graph domain (FEAT-449, Sprints 1 + 1.5/2). Declares the BOE
  (Boletin Oficial del Estado) consolidated-legislation vocabulary:
  norma, articulo and materia entities, their provenance relations
  (modifica, deroga, pertenece_a), the article_in_force temporal
  traversal pattern, the legal_articulos_view ArangoSearch view + the
  search_articles lexical-candidate pattern, and the append-only
  SpanSuppression entity written by the librarian answer layer's span
  verifier. Zero LLM involvement in retrieval — ingestion and resolution
  are entirely deterministic.

entities:
  Norma:
    collection: norma
    source: boe
    key_field: boe_id
    properties:
      - boe_id:
          type: string
          required: true
          unique: true
          description: Canonical BOE identifier, e.g. BOE-A-2015-10566 (normalize_boe_id output)
      - titulo:
          type: string
          description: Official title of the norm
      - rango:
          type: string
          description: Legal rank of the norm (e.g. ley, real_decreto, orden)
      - fecha_disposicion:
          type: date
          description: Date the norm was enacted
      - fecha_publicacion:
          type: date
          description: Date the norm was published in the BOE
      - materia_id:
          type: string
          description: Identifier of the materia this norm belongs to (for pertenece_a)

  Articulo:
    collection: articulo
    source: boe
    key_field: articulo_key
    properties:
      - articulo_key:
          type: string
          required: true
          unique: true
          description: Composite key '{boe_id}:{numero}' (article_key output)
      - norma_ref:
          type: string
          required: true
          description: BOE id of the parent norma
      - numero:
          type: string
          required: true
          description: Article designator as it appears in the source (e.g. '5', '5 bis')
      - versions:
          type: list
          required: true
          description: >
            Ordered list of ArticleVersion entries (n, text, valid_from, valid_to,
            modified_by, kind, source, derived). Shape enforced in Python by
            BOEDataSource, not by the ontology schema (PropertyDef.type is a
            closed Literal with no nested-model support).

  Materia:
    collection: materia
    key_field: materia_id
    properties:
      - materia_id:
          type: string
          required: true
          unique: true
          description: Static taxonomy identifier for a legal materia
      - nombre:
          type: string
          required: true
          description: Display name of the materia

  SpanSuppression:
    collection: span_suppressions
    key_field: suppression_id
    properties:
      - suppression_id:
          type: string
          required: true
          unique: true
          description: Composite record id ("{execution_id}:{seq}")
      - execution_id:
          type: string
          required: true
          description: Librarian flow execution this suppression belongs to
      - suppressed_text:
          type: string
          required: true
          description: The sentence/note text that was suppressed
      - claimed_anchors:
          type: list
          description: SpanRef/payload keys the suppressed text claimed as anchors
      - reason:
          type: string
          required: true
          description: >
            One of span_not_found | hash_mismatch | quote_mismatch |
            anchor_lost | atom_contradicted (SuppressionRecord.reason)
      - user_id:
          type: string
          description: User attributed to the execution, when known
      - created_at:
          type: string
          required: true
          description: >
            When the suppression was recorded, ISO-8601 datetime
            (PropertyDef.type has no "datetime" literal — schema.py:30 —
            so this is declared as "string" like the rest of the
            codebase's timestamp-as-ISO-string properties; deviation
            from the spec §3 M3 YAML block noted in the task's
            Completion Note)

relations:
  modifica:
    from: Norma
    to: Articulo
    edge_collection: modifica

  deroga:
    from: Norma
    to: Norma
    edge_collection: deroga

  pertenece_a:
    from: Norma
    to: Materia
    edge_collection: pertenece_a
    discovery:
      strategy: field_match
      rules:
        - source_field: materia_id
          target_field: materia_id
          match_type: exact
          description: Norm-to-materia membership via materia_id field

search_views:
  legal_articulos_view:
    links:
      - entity: Articulo
        fields:
          - path: "versions[*].text"
            analyzers: ["text_es", "text_en"]
      - entity: Norma
        fields:
          - path: "titulo"
            analyzers: ["text_es", "text_en"]

traversal_patterns:
  article_in_force:
    description: >
      Resolve which wording of an article was legally in force on a given
      date. Selection is O(1) over the embedded versions[] array, not a
      graph traversal. Boundary semantics: valid_from is INCLUSIVE (a
      version starts applying on its valid_from date) and valid_to is
      EXCLUSIVE (the version stops applying on its valid_to date, when the
      next version takes over); a null valid_to means the version is
      currently in force. A date before the first version's valid_from
      returns no result — never version 0 by default.
    trigger_intents:
      - que decia el articulo
      - redaccion vigente
      - article in force
      - wording on date
    query_template: >
      FOR a IN @@articulo
        FILTER a._key == @articulo_key
        LIMIT 1
        FOR v IN a.versions
          FILTER v.valid_from <= @as_of
          FILTER v.valid_to == null OR v.valid_to > @as_of
          RETURN v
    post_action: none

  search_articles:
    description: >
      Lexical candidate search over article wordings, then in-force version
      resolution for @as_of. SEARCH matches at DOCUMENT level (any version's
      text can match) — the temporal filter selects the in-force version and
      the Python helper applies the token-containment guard so a hit that
      exists only in a superseded wording is dropped (see search_articles()
      in parrot_tools/legal/boe/queries.py). Analyzer names cannot be bind
      vars inside ANALYZER()/TOKENS() and view names cannot be bind vars at
      all — both are literal here, matching the view declared above.
    trigger_intents:
      - que dice la ley sobre
      - que articulo regula
      - normativa aplicable
      - which article regulates
    query_template: >
      FOR a IN legal_articulos_view
        SEARCH ANALYZER(a.versions.text IN TOKENS(@query, "text_es"), "text_es")
            OR ANALYZER(a.versions.text IN TOKENS(@query, "text_en"), "text_en")
        LET score = BM25(a)
        SORT score DESC
        LIMIT @limit
        FOR v IN a.versions
          FILTER v.valid_from <= @as_of
          FILTER v.valid_to == null OR v.valid_to > @as_of
          RETURN { articulo_key: a._key, norma_ref: a.norma_ref,
                   numero: a.numero, version: v, score: score }
    post_action: none
