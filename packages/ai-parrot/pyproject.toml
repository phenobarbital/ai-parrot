# FEAT-523 (TASK-2854): every provider client now ships from its own
# ai-parrot-client-<provider> satellite (extracted in TASK-2849..2853) and
# registers itself with LLMFactory via a `parrot.clients` entry point —
# these extras install the satellite instead of pinning its SDK directly.
# `openai==3.3.1`/`tiktoken` are the one exception: OpenAIBaseClient
# (parrot/clients/openai_base.py) stays in core and is subclassed by
# SEVEN satellites (openai, groq, zai, moonshot, openrouter, local,
# nvidia), so its SDK stays a core-owned, separately opt-in extra rather
# than being duplicated across every satellite's own pyproject.toml.
anthropic = [
    "ai-parrot-client-anthropic",
]

# FIX-2: Bedrock extra is opt-in; pulls boto3+botocore (~30 MB) only for users
# who actually deploy via AWS Bedrock.  The `anthropic` extra stays clean for
# direct-API users. AnthropicClient's `backend="bedrock"` transport is part
# of ai-parrot-client-anthropic itself (already depends on
# anthropic[aiohttp,aws]) — same satellite as the `anthropic` extra above.
bedrock = [
    "ai-parrot-client-anthropic",
]

# FEAT-302: native Bedrock Converse API client (BedrockConverseClient) —
# opt-in extra, distinct from the `bedrock` extra above (anthropic[aws],
# used by AnthropicClient's Bedrock backend, FEAT-232). Named
# `bedrock-native` per the spec (sdd/specs/bedrock-client-llm.spec.md
# Module 6 / Acceptance Criteria) — NOT the same as the `bedrock-converse`
# factory/client_type key (parrot.clients.factory.SUPPORTED_CLIENTS,
# BedrockConverseClient.client_type), which is unrelated and unchanged.
# ai-parrot-client-amazon (BedrockConverseClient/NovaClient/
# BedrockMantleClient) already depends on aioboto3>=13.2.0 itself — see
# that satellite's pyproject.toml for the same floor-lowering rationale
# previously documented here.
bedrock-native = [
    "ai-parrot-client-amazon",
]

claude-agent = [
    "ai-parrot-client-anthropic",
]

codex-agent = [
    # "bridge" is ai-parrot-client-openai's own optional extra for
    # codex_tool_bridge.py's MCP<->stdio bridge server (mcp/starlette/
    # uvicorn) — see that satellite's pyproject.toml.
    "ai-parrot-client-openai[bridge]",
]

openai = [
    "ai-parrot-client-openai",
    # openai==3.3.1 / tiktoken>=0.9.0 are both base ai-parrot dependencies
    # now (see `dependencies` above) — nothing else to pin here.
]

google = [
    "ai-parrot-client-google",
    # NOT owned by the LLM client (verified via grep — parrot/clients/
