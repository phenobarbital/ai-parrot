[build-system]
requires = [
    "setuptools>=77.0.0",
    "Cython==3.0.11",
    "wheel>=0.44.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "ai-parrot"
dynamic = ["version"]
description = "Framework for building AI agents for Navigator"
authors = [
    {name = "Jesus Lara", email = "jesuslara@phenobarbital.info"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["asyncio", "asyncpg", "aioredis", "aiomcache", "artificial intelligence", "ai", "chatbot", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Environment :: Web Environment",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

dependencies = [
    # Build tools
    "Cython==3.0.11",
    # Core data / utilities
    "tabulate==0.9.0",
    "markdown2==2.5.4",
    "beautifulsoup4>=4.12",
    "nh3>=0.2.14",
    "python-datamodel>=0.10.17",
    "backoff==2.2.1",
    # parrot.clients.base → clients/gpt.py imports tenacity unconditionally,
    # so it must be a core dependency (a bare install could not import
    # parrot.clients without it).
    "tenacity>=8.2",
    "typing-extensions>=4.14.1,<5",
    "pydantic==2.12.5",
    # Required for pydantic.EmailStr (FEAT-441: FirefliesFilters.organizers/
    # .participants email validation).
    "email-validator>=2.0",
    "PyYAML>=6.0.2",
    "python-frontmatter>=1.1.0",
    # Obsidian-flavored markdown parsing (wikilinks/embeds/tags) for the
    # shared vault interface (parrot.interfaces.obsidian) — FEAT-392.
    "marko>=2.0",
    "xmltodict>=0.14.2",
    "tiktoken>=0.9.0",
    "psutil>=5.9",
    # Text splitters live in core (parrot.loaders.splitters) — Rust-backed
    # chunking used by AbstractLoader. Moved here from ai-parrot-loaders to
    # break the circular import (loaders depends on core).
    "semantic-text-splitter>=0.30,<1.0",
    # Navigator stack (core)
    "navconfig[default]>=2.2.2",
    # navigator-auth<=0.20.9 passes a `PolicyEffect` enum (not a str) to the
    # rs_pep Rust engine's `default_effect` arg, causing every ABAC/PBAC
    # evaluation to fail-closed with a PyO3 TypeError. Require >0.20.9.
    "navigator-auth>0.20.9",
    "navigator-session>=0.6.5",
    # navigator-api 3.0.3+ ships the FileManager interface AI-Parrot relies on.
    # 3.1.2 also fixes the aiohttp RequestHandler kwargs warning (invalid
    # client_timeout/max_request_size were silently dropping every custom
    # server setting). Pin to 3.1.2 to prevent silent downgrades and to
    # guarantee that fix is present.
    "navigator-api[uvloop,locale,google]>=3.1.2",
    # Async DB — base only (asyncpg, aiosqlite, pandas, pgvector)
    "asyncdb>=2.11.6",
    # AgentsFlow state checkpointing (FEAT-399) — binary checkpoint encoding,
    # native Pydantic/datetime/UUID serialization; never pickle.
    "ormsgpack>=1.5",
    # HTTP / networking
    "rich>=13.0",
    # requests is otherwise transitive; pin to the 2.33 series — the intersection
    # of flowtask 5.12.3 (>=2.33.0) and arxiv>=3.0.0 (<2.34).
    "requests>=2.33,<2.34",
    "click>=8.1.7",
    "prompt_toolkit>=3.0",
    "aiohttp-swagger3==0.10.0",
    "aiohttp-sse-client==0.2.1",
    "aiohttp-cors>=0.8.1",
    "brotli==1.2.0",
    "urllib3==2.7.0",
    # parrot.interfaces.http imports proxylists.proxies unconditionally at
    # module level, so HTTPService (the base of most HTTP toolkits) cannot be
    # imported without it. It was previously undeclared — a bare install of
    # ai-parrot could not `import parrot.interfaces.http`.
    "proxylists>=0.12.0",
    # aioquic and pylsqpack moved to ai-parrot-server[mcp] extra in FEAT-203
    # API / OpenAPI tools
    "prance>=25.4.8.0",
    "openapi-schema-validator==0.6.3",
    "openapi-spec-validator>=0.7.1",
    # async-notify minimal — full notification backends moved to ai-parrot-integrations[messaging].
    # The base package itself must stay in core: parrot/bots/agent.py imports
    # NotificationMixin unconditionally, and parrot/notifications/__init__.py
    # does `from notify import Notify` at module level, so `parrot.bots` cannot
    # be imported without it. Use `ai-parrot[notify-all]` for the backends.
    # Floor raised to >=1.6.0 (FEAT-445 TASK-2318) to keep this base pin at
    # or above ai-parrot-server[comm-center]'s own floor — see that extra's
    # comment for why CommCenter requires >=1.6.0.
    "async-notify>=1.6.0",
    "ddgs>=9.5.2",
    # State machine / workflow (core)
    "python-statemachine==2.5.0",
    "cel-python>=0.4",
    "questionary>=2.1.1",
    # Pandas stays in core (owner decision)
    "pandas>=2.0.0",
    # Code-review fix (FEAT-380 sandbox-hardening, post-TASK-1945):
    # `repl_worker/transport.py` (Arrow IPC/shm DataFrame transport, the
    # PRIMARY path `PythonPandasTool._get_worker_handle()` uses to seed
    # every DataFrame into the worker) imports `pyarrow` unconditionally.
    # It's a lazy, function-local import (only paid for when
    # `inject_dataframe()` actually runs), but that's still the default
    # DataFrame-injection path — an undeclared dependency there means a
    # bare `pip install ai-parrot` breaks the tool at first use instead of
    # at install time. Same floor pin as ai-parrot-server (FEAT-327).
    "pyarrow>=25.0",
    # SQL validation for DatabaseToolkit (FEAT-062)
    "sqlglot>=20.0",
    "numexpr==2.10.2",
    # Episodic memory default backend (FAISS) — required whenever an agent
    # enables episodic memory without an explicit pgvector DSN.
    "faiss-cpu>=1.9.0",
    "navigator-eventbus>=0.2.1",
]

[project.scripts]
parrot = "parrot.cli:cli"
# GraphIndex CLI — build an interactive knowledge graph from a code repo.
parrot-graphindex = "parrot.knowledge.graphindex.cli:main"
# LLM Wiki CLI — machine-first codebase KB for coding assistants (FEAT-260).
wikitoolkit = "parrot.knowledge.wiki.cli:main"
# parrot-fs moved to ai-parrot-server in FEAT-203

[project.optional-dependencies]
# ---------------------------------------------------------------------------
# Extras groups (from FEAT-056 — runtime-dependency-reduction)
# ---------------------------------------------------------------------------

# All notification backends (msgraph, twilio, o365, etc.)
# Floor raised to >=1.6.0 (FEAT-445 TASK-2318, code-review follow-up) — this
# extra requests the same async-notify[all] distribution the CommCenter
# runtime version guard protects; left at >=1.4.2 in the original pass,
# which the acceptance criterion ("all relevant extras") did not cover.
notify-all = [
    "async-notify[all]>=1.6.0",
]

# Database / query tools (querysource, psycopg, advanced asyncdb extras)
db = [
    "querysource>=4.1.11",
    "psycopg-binary==3.2.6",
    "jq==1.7.0",
    "asyncdb[bigquery,mongodb,arangodb,influxdb,boto3,sqlalchemy]>=2.12.0",
]

# Google BigQuery specific
bigquery = [
    "google-cloud-bigquery>=3.30.0",
]

# PDF / document generation and conversion
pdf = [
    "weasyprint==69.0",
    "fpdf==1.7.2",
    "markdownify>=1.2.2",
    "python-docx==1.1.2",
]

# OCR (requires tesseract system package)
ocr = [
    "pytesseract>=0.3.13",
]

# Audio processing (requires ffmpeg)
audio = [
    "pydub==0.25.1",
]

# Financial analysis (ta-lib requires libta-lib-dev)
finance = [
    "ta-lib==0.6.8",
    "pandas-datareader>=0.10.0",
]

# FlowtTask DAG execution (pulls asyncdb[all] — heavy)
# 5.12.3 relaxes its requests pin (==2.32.4 -> >=2.33.0), compatible with
# the workspace's requests>=2.33,<2.34 pin (intersection with arxiv>=3.0.0).
flowtask = [
    "flowtask>=5.12.3",
]

# GraphIndex knowledge graph indexing (FEAT-187)
# Note: faiss-cpu is already in core dependencies — not included here
graphindex = [
    "rustworkx>=0.15",
    "networkx>=3.0",
    "tree-sitter>=0.23",
    "tree-sitter-languages>=1.10",
    "pathspec>=0.12",
    "aiosqlite>=0.17",
    "orjson>=3.9",
]

# LLM Wiki pluggable per-language scanners (FEAT-394) — accurate
# tree-sitter outlines for PHP/JS/TS/Rust `wikitoolkit build` plugins.
# Optional: every plugin degrades to a stdlib-only heuristic when this
# extra is not installed, so core install gains zero new dependencies.
# Individual grammar wheels (not `tree-sitter-languages`, which is
# effectively unmaintained and incompatible with `tree-sitter>=0.23` on
# newer Pythons per the graphindex extra's own precedent) — each ships
# `abi3` wheels covering py3.10-3.12, verified on PyPI 2026-07-31,
# following the `tree_sitter_python` pattern already used by graphindex.
wiki-languages = [
    "tree-sitter>=0.23",
    "tree-sitter-php>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-perl>=0.23",
]

# Leiden community detection for GraphIndex (FEAT-401) — guarantees
# internally well-connected communities, unlike Louvain. `python-igraph`
# is a C library (~15 MB installed); kept opt-in like `graphindex` and
# `wiki-languages` above. `detect_communities()` falls back to Louvain
# with a logged warning when this extra is not installed.
leiden = [
    "leidenalg>=0.10",
    "python-igraph>=0.10",
]

# Full wiki stack: graph indexing + accurate tree-sitter language grammars
# + Leiden community detection. One-shot install for `wikitoolkit build`.
wiki = [
    "ai-parrot[graphindex,wiki-languages,leiden]",
    "pymupdf>=1.27",
]

# Task scheduling moved to ai-parrot-server[scheduler] in FEAT-203.
# FEAT-453 (Decision D1) deliberately, partially REVERSES that move: an
# agent process needs to schedule reminders (e.g. the Spanish tax-calendar
# callbacks in parrot/scheduler/inprocess.py) without taking a dependency
# on the full server distribution. This is NOT a regression to "fix back" —
# it is an intentional, documented exception. `AgentSchedulerManager` and
# the rest of `_SERVER_CLASSES` in parrot/scheduler/__init__.py stay
# satellite-only; only the new, distinctly-named `InProcessScheduler` lives
# in core. Pinned to the exact version the satellite uses (apscheduler
# ==3.11.2) to avoid a split-brain dependency between core and satellite.
scheduler = ["apscheduler==3.11.2"]

# Server layer — all server infrastructure via satellite (FEAT-203)
server = [
    "ai-parrot-server[all]",
]

# ArangoDB graph database — MOVED to ai-parrot-embeddings[arango]
