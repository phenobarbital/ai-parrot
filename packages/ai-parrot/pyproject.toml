# ai-parrot-embeddings[all] covers all moved backends.
# Note: chart/infographic/visualization renderers moved to ai-parrot-visualizations in FEAT-200.
# Note: scheduler extra and server layer moved to ai-parrot-server in FEAT-203.
all = [
    "ai-parrot[agents,images,llms,integrations,db,bigquery,pdf,ocr,audio,finance,flowtask,reddit,mcp,charts,docling,visualizations,rust]",
    "ai-parrot-embeddings[all]",
    "ai-parrot-integrations[all]",
    "ai-parrot-server[all]",
]

# all-fast: lightweight embedding stack via satellite
all-fast = [
    "ai-parrot[agents-lite,llms,integrations]",
    "ai-parrot-embeddings[huggingface,faiss,pgvector]",
]

