security = [
    # `gguf` extra dropped: it pulls llama-cpp-python (native compile) only to
    # load GGUF models via llama.cpp, but we only use the deBERTa detector
    # (torch/transformers). See abstract.py PromptInjectionDetector("deberta").
    "pytector==0.2.0",
    # ONNX Runtime backend for the model-backed guardrails (prompt-injection
    # classifier today; the NLI groundedness tier later). Runtime only: it
    # loads a pre-exported graph, it never produces one (see the `dev` extra
    # for the exporter). The transformers tokenizer it needs already arrives
    # with pytector.
    #
    # Why: measured 2026-08-20 on `protectai/deberta-v3-base-prompt-injection`
    # (what pytector's "deberta" alias resolves to), ONNX fp32 runs the SAME
    # weights at 32.96 ms p50 against torch's 118.99 ms — 3.6x faster with
    # ZERO flipped verdicts (max|delta| = 0.000). Evidence:
    # `benchmarks/injection_guardrail_latency/results/report.md`.
    #
    # Gotcha for whoever wires this up: ORT sizes its intra-op thread pool to
    # every physical core PER SESSION. Uncapped, "off-loop" inference still
    # pegs the machine and starves the event loop — set
    # `intra_op_num_threads` / `inter_op_num_threads` on the SessionOptions.
    # Prior art: `voice/tts/supertonic_inference.py:462-472`.
    "onnxruntime>=1.16",
    # FEAT-439: declared explicitly — the ONNX engine-resolution path
    # (offline cache probing via `try_to_load_from_cache`) and
    # `warmup_injection_model()`'s `snapshot_download` both call into this
    # directly. It arrived transitive-only via transformers/pytector until
    # now. Bound `<1.0` to stay compatible with the `audio` extra's
    # whisperx 3.8.5, which pins `huggingface-hub<1.0.0` (pyproject:~391);
    # `>=0.24` is comfortably below the installed 0.36.2 and well past the
    # release that added `allow_patterns`/`local_files_only` support to
    # `snapshot_download`/`try_to_load_from_cache`.
    "huggingface_hub>=0.24,<1.0",
]

xai = [
    "xai-sdk>=1.12.0",
]

# WARNING: `gemma4` is MUTUALLY EXCLUSIVE with `audio` / `ml-heavy` / `images`.
# Gemma 4 requires transformers>=5.0 + huggingface_hub>=1.0 + torch 2.11,
# but whisperx 3.8.5 (used by the audio pipeline) pins huggingface-hub<1.0
# and torch~=2.8.0. Install this extra in a dedicated environment.
gemma4 = [
    "transformers>=5.0.0",
    "torch>=2.13.0",
    "accelerate>=1.9.0",
]

deploy = [
    "gunicorn>=23.0.0",
]

docling = [
    "docling[tesserocr]>=2.74.0",
]

filesystem-transport = [
    "aiofiles>=23.0",
]

filesystem-transport-full = [
    "aiofiles>=23.0",
    "watchdog>=4.0",
    "rich>=13.0",
    "click>=8.0",
]

# matrix extra moved to ai-parrot-integrations[matrix]

# Meta-extra for messaging channels (backward-compat alias)
messaging = [
    "ai-parrot-integrations[messaging]",
]

# OpenTelemetry distributed tracing (FEAT-176 — lifecycle events)
otel = [
    "opentelemetry-api>=1.25,<2.0",
    "opentelemetry-sdk>=1.25,<2.0",
]

# Full observability stack (FEAT-177 — spans + metrics + cost + OTLP exporters)
observability = [
    "opentelemetry-api>=1.25,<2.0",
    "opentelemetry-sdk>=1.25,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25,<2.0",
]

# FEAT-462 — Unified Telemetry Bus: OpenLIT and Traceloop are no longer
# monkey-patching SDK dependencies (both `openlit` and `traceloop-sdk`
# hard-pin conflicting `openai` version ranges — the root cause this
# feature eliminates). They are deployment-time OTLP endpoint
# configurations instead: configure `ObservabilityConfig.otlp_targets`
# (multi-endpoint OTLP export) or the `OpenLitUsageRecorder` (usage-only
# spans fanned out via the AbstractLogger layer). These extras are kept
# empty for backward compat with existing `pip install
# ai-parrot[observability-openlit]` invocations — TASK-2477 repurposes
# `observability-openlit` to install the minimal `ai-parrot-openlit-bridge`
# helper package (endpoint validation + health-check CLI, no SDK).
observability-openlit = []

# FEAT-462 — deprecated no-op extra, kept for backward compat. See
# observability-openlit above; Traceloop's bridge equivalent is deferred.
observability-traceloop = []

# Pluggable usage-logging: Prometheus backend (pull-based metrics + cost).
# The default "logging" usage backend needs NO extra — it uses stdlib logging.
observability-prometheus = [
    "prometheus-client>=0.20,<1.0",
]

# Developer / CI tooling (not shipped to end users)
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-benchmark>=4.0",
    "ruff>=0.4",
    # FEAT-322 TASK-1850: reducer/host property tests (fold invariant,
    # totality, arbitration, expiry). The spec's contract claimed this was
    # "already used in repo tests" — verified absent in-tree; added here.
    "hypothesis>=6.100",
    # ONNX export + quantization toolchain for
    # `benchmarks/injection_guardrail_latency/export.py`. Build-time only —
    # deliberately NOT in `security`, so a production install does not carry
    # the optimum/onnx toolchain merely to load a graph someone else produced.
    #
    # WARNING: dynamic int8 quantization is NOT safe for DeBERTa-v3 — measured
    # 39/96 verdicts flipped and 0% recall, because its disentangled attention
    # leaves most attention MatMuls unquantizable. Any quantized graph must
    # pass the numerical-parity gate in that harness before it ships.
    "onnx>=1.22",
    "optimum[onnxruntime]>=2.0",
]

# Remote tool executors (parrot.tools.executors). Pulls the optional
# kubernetes_asyncio client used by K8sToolExecutor. The Qworker HTTP
# transport falls back to plain aiohttp (already a core dependency)
# when the proprietary qclient/qworker package is not installed; the
# Redis transport uses the existing ``redis.asyncio`` already shipped
# via the agents extra.
remote-tools = [
    "kubernetes_asyncio>=29.0.0",
    "aiodocker>=0.24.0",
]

# Visualizations satellite — heavy chart/infographic renderers (FEAT-200)
