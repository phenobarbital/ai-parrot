# FEAT-302: native Bedrock Converse API client (BedrockConverseClient) —
# opt-in extra pulling aioboto3, distinct from the `bedrock` extra above
# (anthropic[aws], used by AnthropicClient's Bedrock backend, FEAT-232).
# Named `bedrock-native` per the spec (sdd/specs/bedrock-client-llm.spec.md
# Module 6 / Acceptance Criteria) — NOT the same as the `bedrock-converse`
# factory/client_type key (parrot.clients.factory.SUPPORTED_CLIENTS,
# BedrockConverseClient.client_type), which is unrelated and unchanged.
bedrock-native = [
    # OVERRIDE (2026-08-05): floor lowered from >=15.1.0 to >=13.2.0 to
    # unblock Python 3.12+/3.13 — asyncdb[boto3] pins aioboto3==13.2.0 and
    # the two extras are mutually exclusive at >=15.1.0.  All Bedrock Runtime
    # APIs used by BedrockConverseClient (converse, converse_stream,
    # apply_guardrail, invoke_model) are present in botocore >=1.35.16
    # (shipped with aioboto3 13.2.0).  The only feature lost on <15.1.0 is
    # bearer-token auth (AWS_BEARER_TOKEN_BEDROCK env var); the client's
    # aws_bearer_token path silently no-ops on older botocore, so IAM keys /
    # STS / instance-role / SSO auth all work normally.
    # TODO: restore >=15.1.0 once asyncdb unpins aioboto3.
    "aioboto3>=13.2.0",
]

