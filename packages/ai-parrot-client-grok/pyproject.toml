[build-system]
requires = ["setuptools>=77.0.0", "wheel>=0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-parrot-client-grok"
version = "0.1.0"
description = "xAI Grok LLM client for AI-Parrot (parrot.clients.grok)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Jesus Lara", email = "jesuslara@phenobarbital.info"}
]
dependencies = [
    "ai-parrot>=0.28.1",
    "xai-sdk>=1.12.0",
]

[project.entry-points."parrot.clients"]
grok = "parrot.clients.grok:GrokClient"
xai = "parrot.clients.grok:GrokClient"

[tool.setuptools.packages.find]
where = ["src"]
include = ["parrot*"]
namespaces = true

[tool.uv.sources]
ai-parrot = { workspace = true }
