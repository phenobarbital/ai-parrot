[build-system]
requires = ["setuptools>=77.0.0", "wheel>=0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-parrot-client-zai"
version = "0.1.0"
description = "Z.ai (Zhipu) LLM client for AI-Parrot (parrot.clients.zai)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Jesus Lara", email = "jesuslara@phenobarbital.info"}
]
dependencies = [
    "ai-parrot>=0.28.1",
    "zai-sdk>=0.2.3",
]

[project.entry-points."parrot.clients"]
zai = "parrot.clients.zai:ZaiClient"
"z.ai" = "parrot.clients.zai:ZaiClient"

[tool.setuptools.packages.find]
where = ["src"]
include = ["parrot*"]
namespaces = true

[tool.uv.sources]
ai-parrot = { workspace = true }
