[build-system]
requires = ["setuptools>=77.0.0", "wheel>=0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-parrot-server"
dynamic = ["version"]
description = "Server infrastructure (handlers, MCP/A2A transports, scheduler, autonomous) for AI-Parrot"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Jesus Lara", email = "jesuslara@phenobarbital.info"}
]
keywords = ["ai", "agents", "server", "mcp", "a2a", "handlers", "scheduler", "autonomous"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "ai-parrot",
    # Parquet dataset-part decoding for the infographic render endpoint
    # (FEAT-327) — dtype-preserving via pyarrow. Declared here (not
    # transitive through pandas) per the resolved brainstorm decision.
    "pyarrow>=25.0",
    # CommCenter's async-notify runtime version guard (FEAT-445 TASK-2318)
    # imports packaging.version.Version directly. Declared here (was
    # previously an undeclared transitive dependency).
    "packaging>=23.0",
]

[project.optional-dependencies]
# APScheduler runtime (for AgentSchedulerManager)
scheduler = [
    "apscheduler==3.11.2",
]

# MCP server transports (QUIC, gRPC, etc.)
# aioquic/pylsqpack power the optional QUIC + WebTransport transport. Every
# consumer resolves those symbols lazily through parrot.mcp._quic.load_quic(),
# so the MCP layer imports fine without this extra — only selecting the "quic"
# transport raises, with an install hint.
mcp = [
    "aioquic==1.3.0",
    "pylsqpack==0.3.23",
    "click>=8.1.7",
    "PyYAML>=6.0.2",
]

# A2A server (optional JWT auth)
a2a = [
    "PyJWT>=2.8.0",
]

# Autonomous orchestrator (file transport)
autonomous = [
    "aiofiles>=23.0",
]

# CommCenter bulk notification sender (FEAT-417) — NotifyClient/NotifyWorker
# publishing, plus Excel/CSV recipient ingestion. Lazy-imported (spec G11):
# importing parrot.handlers.comm_center / parrot.services.comm_center never
# requires this extra; only calling a function that actually publishes does.
# Pin >=1.6.0 (FEAT-445 TASK-2318): CommCenter enqueues an inline Jinja2
# template string in the xadd payload; async-notify < 1.6.0 silently
# ignores that key and delivers an empty body instead (fixed by
# async-notify FEAT-003, "Inline Jinja2 template source for send()").
comm-center = [
    "async-notify>=1.6.0",
    "pandas>=2.2",
    "openpyxl>=3.1.2,<=3.1.5",
]

# Aggregator: all server extras
all = [
    "ai-parrot-server[scheduler,mcp,a2a,autonomous,comm-center]",
]

[project.scripts]
parrot-fs = "parrot.autonomous.transport.filesystem.cli:main"

[project.urls]
Homepage = "https://github.com/phenobarbital/ai-parrot"
Source = "https://github.com/phenobarbital/ai-parrot"

[tool.setuptools.dynamic]
version = {attr = "parrot.server.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["parrot*"]
namespaces = true

# Non-Python data files: schema DDL and the gRPC proto definition. Without
# this section setuptools ships only the .py modules.
[tool.setuptools.package-data]
"parrot.handlers" = ["*.sql"]
"parrot.handlers.models" = ["*.sql"]
"parrot.mcp.transports" = ["*.proto"]
# Embedded Admin UI (FEAT-468): built by release CI (Node 24 LTS + pnpm 9)
# into src/parrot/server/ui/dist/ before `uv build`; never committed to git.
# Globs are non-recursive per key — keep Vite's output flat (dist/*, dist/assets/*).
"parrot.server.ui" = ["dist/*", "dist/assets/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "wheel_build: requires building the wheel (slow, needs uv)",
    "requires_apscheduler: requires the scheduler extra (apscheduler)",
    "requires_aioquic: requires the mcp extra (aioquic)",
    "requires_mcp_sdk: requires the official mcp SDK (mcp extra)",
    "live: hits live external services; opt-in, deselect with -m 'not live'",
]

[tool.uv.sources]
ai-parrot = { workspace = true }
