[build-system]
requires = ["setuptools>=77.0.0", "wheel>=0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-parrot-client-moonshot"
version = "0.2.0"
description = "Moonshot AI (Kimi) LLM client for AI-Parrot (parrot.clients.moonshot)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Jesus Lara", email = "jesuslara@phenobarbital.info"}
]
dependencies = [
    "ai-parrot>=0.29.0",
    # No extra SDK: MoonshotClient extends OpenAIBaseClient (core) and
    # uses only tenacity (already a core ai-parrot base dependency).
]

[project.entry-points."parrot.clients"]
moonshot = "parrot.clients.moonshot:MoonshotClient"
kimi = "parrot.clients.moonshot:MoonshotClient"

[tool.setuptools.packages.find]
where = ["src"]
include = ["parrot*"]
namespaces = true

[tool.uv.sources]
ai-parrot = { workspace = true }
