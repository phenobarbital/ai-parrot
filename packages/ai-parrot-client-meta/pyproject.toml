[build-system]
requires = ["setuptools>=77.0.0", "wheel>=0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-parrot-client-meta"
version = "0.2.0"
description = "Meta Model API (Muse Spark) LLM client for AI-Parrot (parrot.clients.meta)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Jesus Lara", email = "jesuslara@phenobarbital.info"}
]
dependencies = [
    "ai-parrot>=0.29.0",
]

[project.entry-points."parrot.clients"]
meta = "parrot.clients.meta:MetaClient"
muse = "parrot.clients.meta:MetaClient"
meta-muse = "parrot.clients.meta:MetaClient"

[tool.setuptools.packages.find]
where = ["src"]
include = ["parrot*"]
namespaces = true

[tool.uv.sources]
ai-parrot = { workspace = true }
