[build-system]
requires = ["setuptools>=77.0.0", "wheel>=0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-parrot-client-gemma4"
version = "0.2.0"
description = "Google Gemma 4 (local, transformers) LLM client for AI-Parrot (parrot.clients.gemma4)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Jesus Lara", email = "jesuslara@phenobarbital.info"}
]
dependencies = [
    "ai-parrot>=0.29.0",
    "transformers>=4.48.0,<5.0",
    # NOT declared here: `torch` — Gemma4Client imports both `torch` and
    # `transformers` lazily inside its methods (a pre-existing "avoid
    # pulling in heavy deps until actually used" pattern, kept as-is by
    # this pure git-mv extraction) and core never pinned torch for this
    # provider either; spec §7's External Dependencies table lists only
    # `transformers` for this satellite. Install torch separately.
]

[project.entry-points."parrot.clients"]
gemma4 = "parrot.clients.gemma4:Gemma4Client"

[tool.setuptools.packages.find]
where = ["src"]
include = ["parrot*"]
namespaces = true

[tool.uv.sources]
ai-parrot = { workspace = true }
