[build-system]
requires = ["setuptools>=77.0.0", "wheel>=0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-parrot-client-openai"
version = "0.2.0"
description = "OpenAI LLM client for AI-Parrot (parrot.clients.openai)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Jesus Lara", email = "jesuslara@phenobarbital.info"}
]
dependencies = [
    "ai-parrot>=0.29.0",
    # The `openai` SDK itself is a base `ai-parrot` dependency (FEAT-523/
    # TASK-2854 core-extras cleanup — OpenAIBaseClient, which stays in
    # core, is subclassed by seven satellites including this one), so
    # `ai-parrot` transitively brings it; not re-pinned here.
    # `openai-codex` (the Codex CLI/SDK agent) is the only dependency
    # genuinely new to this satellite.
    "openai-codex>=0.1.0",
]

[project.optional-dependencies]
# codex_tool_bridge.py's MCP<->stdio bridge server is only ever imported
# lazily (TYPE_CHECKING / inside a method) by codex_agent.py — merely
# `import parrot.clients.openai` never needs these. Opt in when actually
# using OpenAICodexClient's tool-bridge feature.
bridge = [
    "mcp>=1.28.1,<2",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.entry-points."parrot.clients"]
openai = "parrot.clients.openai:OpenAIClient"
codex-agent = "parrot.clients.openai:OpenAICodexClient"
openai-codex = "parrot.clients.openai:OpenAICodexClient"
codex-code = "parrot.clients.openai:OpenAICodexClient"

[tool.setuptools.packages.find]
where = ["src"]
include = ["parrot*"]
namespaces = true

[tool.uv.sources]
ai-parrot = { workspace = true }
