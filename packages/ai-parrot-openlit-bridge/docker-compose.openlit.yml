# docker-compose.openlit.yml — bundled OpenLIT collector + UI snippet
# (FEAT-462 — Unified Telemetry Bus).
#
# ai-parrot no longer bundles/depends on the `openlit` Python SDK — OpenLIT
# is now a plain OTLP HTTP collector + dashboard you run separately, and
# ai-parrot exports GenAI SemConv spans to it via
# `ObservabilityConfig.otlp_targets` / `OpenLitUsageRecorder`.
#
# Usage:
#   docker compose -f docker-compose.openlit.yml up -d
#   parrot-openlit-check http://localhost:4318   # verify reachability
#
# Then configure ai-parrot to export to it, e.g.:
#   OBSERVABILITY_ENABLED=true
#   OBSERVABILITY_BACKEND=otel
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
# or, for multi-target export alongside another collector:
#   OTLP_TARGETS=[{"name":"openlit","endpoint":"http://localhost:4318"}]

services:
  openlit:
    image: ghcr.io/openlit/openlit:latest
    container_name: openlit
    ports:
      # Bound to loopback only — this is a local-dev snippet, not a
      # production deployment artifact. Change to "4318:4318" (all
      # interfaces) deliberately if you need remote access, and change
      # the Postgres credentials below first.
      - "127.0.0.1:4318:4318"  # OTLP HTTP receiver (traces/metrics)
      - "127.0.0.1:3000:3000"  # OpenLIT dashboard UI
    environment:
      # Postgres backing store for the dashboard. These are local-dev-only
      # defaults — change credentials before any non-local deployment.
      INIT_DB_HOST: openlit-db
      INIT_DB_USER: postgres
      INIT_DB_PASSWORD: postgres
      INIT_DB_NAME: openlit
    depends_on:
      - openlit-db
    restart: unless-stopped

  openlit-db:
    image: postgres:16-alpine
    container_name: openlit-db
    environment:
      # Local-dev-only defaults — see the openlit service's INIT_DB_* above.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: openlit
    volumes:
      - openlit-db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  openlit-db-data:
