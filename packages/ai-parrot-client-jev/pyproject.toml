[build-system]
requires = ["setuptools>=77.0.0", "wheel>=0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-parrot-client-jev"
version = "0.2.4"
description = "TypeSafe AI System One (Jev) client for AI-Parrot (parrot.clients.jev)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [
    {name = "Jesus Lara", email = "jesuslara@phenobarbital.info"}
]
dependencies = [
    "ai-parrot>=1.0.4",
    # No vendor SDK: the official `typesafe-sdk` is built on httpx2, which the
    # codebase conventions forbid. JevClient speaks the System One HTTP API
    # (POST /v1/systemone) directly over aiohttp, with tenacity for retries —
    # both already core ai-parrot base dependencies.
]

[project.entry-points."parrot.clients"]
jev = "parrot.clients.jev:JevClient"
typesafe = "parrot.clients.jev:JevClient"

[tool.setuptools.packages.find]
where = ["src"]
include = ["parrot*"]
namespaces = true

[tool.uv.sources]
ai-parrot = { workspace = true }
