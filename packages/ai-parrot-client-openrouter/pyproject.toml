[build-system]
requires = ["setuptools>=77.0.0", "wheel>=0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-parrot-client-openrouter"
version = "0.1.0"
description = "OpenRouter LLM client for AI-Parrot (parrot.clients.openrouter)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Jesus Lara", email = "jesuslara@phenobarbital.info"}
]
dependencies = [
    "ai-parrot",
    # No extra SDK: OpenRouterClient extends OpenAIBaseClient (core) and
    # uses only aiohttp (already a core ai-parrot base dependency).
]

[project.entry-points."parrot.clients"]
openrouter = "parrot.clients.openrouter:OpenRouterClient"

[tool.setuptools.packages.find]
where = ["src"]
include = ["parrot*"]
namespaces = true

[tool.uv.sources]
ai-parrot = { workspace = true }
