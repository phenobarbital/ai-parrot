name: Build and publish AI-Parrot packages

on:
  release:
    types: [created]

jobs:
  build-core:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: packages/ai-parrot
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cibuildwheel maturin twine cython build

      - name: Build wheels on Ubuntu
        env:
          CIBW_ARCHS: x86_64
          CIBW_BEFORE_BUILD: "curl https://sh.rustup.rs -sSf | sh -s -- -y && source $HOME/.cargo/env"
          CIBW_ENVIRONMENT: "PATH=/root/.cargo/bin:$PATH"
          RUST_SUBPACKAGE_PATH: src/parrot/yaml_rs
          CIBW_BUILD: "cp3{11,12,13,14}-*"
        run: |
          pip install cibuildwheel
          cibuildwheel --platform linux --output-dir ${{ github.workspace }}/dist

      - name: Build sdist
        if: matrix.python-version == '3.12'
        working-directory: packages/ai-parrot
        run: python -m build --sdist --outdir ${{ github.workspace }}/dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: core-dist-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            ${{ github.workspace }}/dist/*.whl
            ${{ github.workspace }}/dist/*.tar.gz

  build-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          cd packages/ai-parrot-tools
          uv build --out-dir ../../dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-tools
          path: dist/*

  build-loaders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          cd packages/ai-parrot-loaders
          uv build --out-dir ../../dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-loaders
          path: dist/*

  build-embeddings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          cd packages/ai-parrot-embeddings
          uv build --out-dir ../../dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-embeddings
          path: dist/*

  build-pipelines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          cd packages/ai-parrot-pipelines
          uv build --out-dir ../../dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-pipelines
          path: dist/*

  build-visualizations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          cd packages/ai-parrot-visualizations
          uv build --out-dir ../../dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-visualizations
          path: dist/*

  build-integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          cd packages/ai-parrot-integrations
          uv build --out-dir ../../dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-integrations
          path: dist/*

  build-formdesigner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          cd packages/parrot-formdesigner
          uv build --out-dir ../../dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-formdesigner
          path: dist/*

  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          cd packages/ai-parrot-server
          uv build --out-dir ../../dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-server
          path: dist/*

  build-advisors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          cd packages/ai-parrot-advisors
          uv build --out-dir ../../dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-advisors
          path: dist/*

  build-navrules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pre-create dist dir
        run: mkdir -p dist

      # maturin-action runs inside a manylinux container (as root).
      # Pre-creating dist/ ensures the runner user owns it so the
      # subsequent sdist step can write to it without permission errors.
      - name: Build wheel (manylinux)
        uses: PyO3/maturin-action@v1
        with:
          working-directory: packages/navrules
          args: --release --out ../../dist
          manylinux: auto

      - name: Build sdist
        run: |
          pip install maturin
          cd packages/navrules
          maturin sdist --out ../../dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-navrules
          path: dist/*

  build-parrot-codec:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          # Linux aarch64 (ARM servers, Graviton)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: auto
          # macOS x86_64 (Intel)
          - os: macos-13
            target: x86_64-apple-darwin
            manylinux: 'off'
          # macOS arm64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            manylinux: 'off'
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: 'off'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pre-create dist dir
        run: mkdir -p dist
        shell: bash

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: packages/ai-parrot/src/parrot/codec-rs
          target: ${{ matrix.target }}
          args: --release --out ${{ github.workspace }}/dist --find-interpreter
          manylinux: ${{ matrix.manylinux }}

      - name: Build sdist
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          pip install maturin
          cd packages/ai-parrot/src/parrot/codec-rs
          maturin sdist --out ${{ github.workspace }}/dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-parrot-codec-${{ matrix.target }}
          path: dist/*

  deploy:
    needs: [build-core, build-tools, build-loaders, build-embeddings, build-pipelines, build-visualizations, build-integrations, build-formdesigner, build-server, build-advisors, build-navrules, build-parrot-codec]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment:
      name: release
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-artifacts

      - name: Collect all distributions
        run: |
          mkdir -p dist
          find dist-artifacts -name '*.whl' -o -name '*.tar.gz' | xargs -I{} mv {} dist/

      - name: List distributions
        run: ls -l dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Every release builds ALL 12 packages, but only the ones whose
          # version moved since the last release can be uploaded — PyPI
          # rejects re-uploads of an existing version, and without this
          # flag ONE unchanged sibling fails the WHOLE deploy (observed:
          # the 0.25.34 and 0.25.32 releases both failed exactly here
          # while all 12 build jobs were green). With it, unchanged
          # packages are skipped and only the bumped ones publish.
          skip-existing: true
