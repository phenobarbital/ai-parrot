name: CI — Monorepo

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-registry:
    name: Lint & Registry Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Sync all workspace packages
        run: uv sync --all-packages

      - name: Check registry freshness
        run: uv run python scripts/generate_tool_registry.py --check

  test-core:
    name: "Test ai-parrot (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Sync core package
        run: uv sync --package ai-parrot

      - name: Run core tests
        run: uv run pytest tests/ -x -q --tb=short --ignore=tests/tools

  test-navrules:
    name: "Test navrules (rust=${{ matrix.rust }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["on", "off"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Rust is needed in both legs: maturin is the build backend. The
      # "off" leg disables the native matcher at runtime only.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Rust crate unit tests
        if: matrix.rust == 'on'
        run: |
          sudo apt-get update && sudo apt-get install -y python3-dev
          cd packages/navrules/rust && cargo test

      - name: Python suite (native backend)
        if: matrix.rust == 'on'
        run: |
          cd packages/navrules
          uv run --no-project --isolated --with pytest --with pytest-asyncio \
            --with-editable . python -m pytest tests -q

      - name: Python suite (pure-Python fallback)
        if: matrix.rust == 'off'
        run: |
          cd packages/navrules
          NAVRULES_DISABLE_RUST=1 uv run --no-project --isolated \
            --with pytest --with pytest-asyncio \
            --with-editable . python -m pytest tests -q

  test-tools:
    name: "Test ai-parrot-tools (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Sync tools package
        run: uv sync --package ai-parrot-tools

      - name: Run tools tests
        run: uv run pytest tests/tools/ -x -q --tb=short

  test-loaders:
    name: "Test ai-parrot-loaders (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Sync loaders package
        run: uv sync --package ai-parrot-loaders

      - name: Run loaders tests
        run: uv run pytest tests/loaders/ -x -q --tb=short
