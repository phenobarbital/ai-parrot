name: Sync main into {staging, dev}

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [staging, dev]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check that ${{ matrix.target }} exists on origin
        id: target_exists
        run: |
          if git ls-remote --exit-code --heads origin ${{ matrix.target }} >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Target branch '${{ matrix.target }}' does not exist on origin; skipping."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Tiered sync. A fast-forward only works when the target is STRICTLY
      # BEHIND main (staging, while it mirrors main). `dev` always carries
      # commits of its own, so --ff-only can never succeed there — it needs a
      # real merge. The original FEAT-187 version used --ff-only for both
      # targets, which meant the dev leg failed on every single run.
      - name: Sync main into ${{ matrix.target }}
        id: sync
        if: steps.target_exists.outputs.exists == 'true'
        continue-on-error: true
        run: |
          set -uo pipefail
          git fetch origin
          git checkout "${{ matrix.target }}"

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "::notice::${{ matrix.target }} already contains main; nothing to do."
            echo "result=uptodate" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge --ff-only origin/main; then
            git push origin "${{ matrix.target }}"
            echo "::notice::Fast-forwarded ${{ matrix.target }} to main."
            echo "result=ff" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge --no-ff --no-edit origin/main \
               -m "chore: sync main into ${{ matrix.target }} (${GITHUB_SHA})"; then
            git push origin "${{ matrix.target }}"
            echo "::notice::Merged main into ${{ matrix.target }}."
            echo "result=merge" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git merge --abort || true
          echo "::warning::Merging main into ${{ matrix.target }} conflicts; opening a sync PR."
          echo "result=conflict" >> "$GITHUB_OUTPUT"
          exit 1

      # Only reached on a genuine content conflict. Uses `gh` rather than
      # peter-evans/create-pull-request@v6, which cannot authenticate against
      # the credential mechanism actions/checkout@v6 installs (it fails with
      # `unable to access ...: The requested URL returned error: 400`).
      - name: Open sync PR if the merge conflicted
        if: steps.target_exists.outputs.exists == 'true' && steps.sync.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="chore/sync-main-into-${{ matrix.target }}-${GITHUB_SHA::7}"

          if ! git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null; then
            git push origin "origin/main:refs/heads/${BRANCH}"
          fi

          EXISTING=$(gh pr list --head "${BRANCH}" --base "${{ matrix.target }}" \
                       --state open --json number -q '.[].number')
          if [ -n "${EXISTING}" ]; then
            echo "::notice::Sync PR #${EXISTING} is already open for ${BRANCH}."
            exit 0
          fi

          gh pr create \
            --base "${{ matrix.target }}" \
            --head "${BRANCH}" \
            --title "chore: sync main into ${{ matrix.target }}" \
            --body "Automated sync from \`main\` after commit ${GITHUB_SHA}.

          Merging \`main\` into \`${{ matrix.target }}\` produced conflicts that
          CI cannot resolve. Please resolve and merge to restore the invariant
          that \`main\` is an ancestor of \`${{ matrix.target }}\`.

          Generated by \`.github/workflows/sync-down.yml\` (FEAT-187)."
