# FEAT-709 — runner adapters for the SDD test-scope kernel. The ONLY extension point (vendored kernels read it too).
# Timeouts are placeholders until measured (spec §8 Q4; evidence in artifacts/logs/).

[runners.pytest]
# Measured 2026-11-15 (FEAT-887): a 24-file merge-tier group takes ~130 s; 60 s cut it mid-run as timed_out.
timeout_s = 600

[runners.vitest]
cwd = "packages/ai-parrot-server/ui"
timeout_s = 120

[runners.cargo]
timeout_s = 300

[runners.parrot-e2e]
tiers = ["merge", "feature"]
timeout_s = 900

