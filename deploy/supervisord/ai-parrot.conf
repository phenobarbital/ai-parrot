; AI-Parrot server (API + embedded web UI) under supervisord.
;
; Install:
;   1. Adjust the paths below (/opt/ai-parrot = repository checkout,
;      /opt/ai-parrot/.venv = its virtualenv with ai-parrot[deploy] installed).
;   2. Build the web UI once per release:  make build-server-ui
;   3. sudo cp deploy/supervisord/ai-parrot.conf /etc/supervisor/conf.d/
;      sudo supervisorctl reread && sudo supervisorctl update
;
; Manage:
;   sudo supervisorctl status ai-parrot
;   sudo supervisorctl restart ai-parrot
;
; Configuration (DB, Redis, auth backends, LLM keys) comes from the
; environment / navconfig env files exactly as for `python run.py`.

[program:ai-parrot]
directory=/opt/ai-parrot
command=/opt/ai-parrot/.venv/bin/gunicorn --config deploy/gunicorn.conf.py "run:create_app()"
environment=APP_PORT="5000",WEB_CONCURRENCY="2",PYTHONUNBUFFERED="1"
user=parrot
autostart=true
autorestart=true
startsecs=10
startretries=3
; gunicorn's master handles TERM gracefully; give in-flight agent calls time.
stopsignal=TERM
stopwaitsecs=150
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/ai-parrot/server.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
redirect_stderr=true

; Single-process alternative (development / small installs): Navigator's own
; runner, same app. Enable this one instead of [program:ai-parrot], never both
; on the same port.
[program:ai-parrot-single]
directory=/opt/ai-parrot
command=/opt/ai-parrot/.venv/bin/python run.py
environment=PYTHONUNBUFFERED="1"
user=parrot
autostart=false
autorestart=true
startsecs=10
stopsignal=INT
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/ai-parrot/server-single.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
redirect_stderr=true
