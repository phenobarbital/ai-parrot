# Redis configuration for AI-Parrot (local development).
#
# AI-Parrot uses several logical databases on the same server
# (see packages/ai-parrot/src/parrot/conf.py):
#   1 -> REDIS_DB (default store: crews, flow checkpoints, credentials...)
#   2 -> CACHEDB (cache)
#   3 -> REDIS_HISTORY_DB / REDIS_DATASET_DB (conversation history, datasets)
#   4 -> REDIS_SERVICES_URL (services)

bind 0.0.0.0
port 6379
# The container is only published on 127.0.0.1 by docker-compose.yml.
# Set a password (see README) before exposing it anywhere else.
protected-mode no

databases 16

# Persistence: AI-Parrot keeps durable state in Redis (flow checkpoints,
# crew definitions/results, OAuth/BYOK credentials), so use AOF + RDB.
dir /data
appendonly yes
appendfsync everysec
save 3600 1 300 100 60 10000

# Never silently evict keys: credentials and checkpoints must not disappear.
# Cache entries carry their own TTL.
maxmemory-policy noeviction

# Keep Pub/Sub consumers (structured-output transport, A2A, WhatsApp hooks)
# from being disconnected under a burst of messages.
client-output-buffer-limit pubsub 64mb 16mb 60

tcp-keepalive 300
timeout 0
loglevel notice
