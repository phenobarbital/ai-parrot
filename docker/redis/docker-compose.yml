services:
  redis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parrot-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    # Optional password: REDIS_PASSWORD=change-me docker compose up -d --build
    # (an empty --requirepass leaves authentication disabled).
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - "${REDIS_PASSWORD:-}"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          redis-cli -p 6379 $${REDIS_PASSWORD:+-a "$${REDIS_PASSWORD}" --no-auth-warning} ping
          | grep -q PONG || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  redis-data:
    name: parrot-redis-data
