# Serves the Matrix .well-known discovery documents (client.json,
# server.json) for the AI-Parrot dev stack (FEAT-463). Needed for Element X
# / any sliding-sync-aware client to discover the homeserver by server name
# alone (parrot.local), and for federation server discovery.
server {
    listen 80 default_server;
    server_name _;

    location = /.well-known/matrix/client {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        alias /usr/share/nginx/html/.well-known/matrix/client;
    }

    location = /.well-known/matrix/server {
        default_type application/json;
        alias /usr/share/nginx/html/.well-known/matrix/server;
    }

    location / {
        return 404;
    }
}
